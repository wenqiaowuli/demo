<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 
    文件描述：板块运动演示（完整版）
    物理内容：展示物块 A 在板块 B 上的相对滑动、共速、滑出及摩擦生热等完整过程，
              双摩擦系数建模（μ₁ = A-B 之间，μ₂ = B-地面之间，μ₂ 默认 0）。
              共速后按 μ_s=μ₁ 判断能否锁死：需 μ₁≥μ₂ 才能一起减速，否则继续相对滑动。
    适用场景：高中物理“板块模型”教学，板 B 固定静止（v₀B = 0），可调物块 A 初速度、
              双动摩擦因数与板长 L，实时显示 v-t 图、相对位移、摩擦生热等数据，
              支持物块滑出后继续运动的情景。
    风格：与斜抛运动演示网页（oblique-throw-motion.html）统一的深色系列。
    -->
    <title>板块运动演示｜高中物理</title>
    <meta name="description" content="高中物理板块模型教学演示：板 B 静止，物块 A 以可调初速度滑上板 B，可调 A-B 与 B-地面双动摩擦因数及板长，实时显示 v-t 图、共速时刻、相对位移、是否滑出与总摩擦生热。">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 12px 32px;
        }
        main {
            width: 100%;
            max-width: 880px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 12px;
            text-align: center;
        }
        .canvas-wrap { width: 100%; }
        canvas {
            display: block;
            width: 100%;
            border: 2px solid #3388dd;
            border-radius: 10px;
            background-color: #0b1828;
        }
        canvas#scene { aspect-ratio: 880 / 520; }
        .chart-panel {
            margin-top: 16px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px 16px;
        }
        .chart-panel canvas {
            aspect-ratio: 880 / 200;
            border-width: 2px;
        }
        .group-title {
            font-size: 12px;
            color: #8899aa;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .control-panel {
            margin-top: 14px;
            width: 100%;
            display: grid;
            grid-template-columns: minmax(240px, 1fr) minmax(280px, 1.25fr);
            gap: 14px;
        }
        @media (max-width: 720px) {
            .control-panel { grid-template-columns: 1fr; }
        }
        .param-group,
        .data-group {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px 16px;
        }
        .param-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 10px;
        }
        .param-row:last-child { margin-bottom: 0; }
        .param-row label {
            font-size: 13px;
            color: #ccd;
            white-space: nowrap;
            min-width: 96px;
        }
        .param-row input[type=range] { flex: 1; }
        .param-row .val {
            min-width: 64px;
            text-align: right;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            color: #ccd;
        }
        .state-rows .param-row .val { min-width: 110px; }
        .data-row {
            margin-top: 14px;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 9px;
        }
        @media (max-width: 720px) {
            .data-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        .data-card {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 10px;
            text-align: center;
        }
        .data-card span {
            display: block;
            font-size: 11px;
            color: #8899aa;
            margin-bottom: 4px;
        }
        .data-card .num {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }
        .actions {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #3388dd;
            border: none;
            color: white;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.15s ease, transform 0.15s ease;
        }
        button:hover:not(:disabled) { background: #2f7cc8; }
        button:active:not(:disabled) { transform: translateY(1px); }
        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #99aabb;
            text-align: center;
            min-height: 16px;
        }
        .legend {
            margin-top: 12px;
            font-size: 12px;
            color: #aab;
            text-align: center;
            line-height: 1.8;
        }
        .legend span { margin: 0 6px; }
    </style>
</head>
<body>
    <main>
        <h1>板块运动演示</h1>
        <div class="canvas-wrap">
            <canvas id="scene" role="img" aria-label="板块运动演示：物块 A 在板块 B 上相对滑动"></canvas>
        </div>
        <section class="chart-panel">
            <div class="group-title">速度-时间图 (v-t)</div>
            <canvas id="graphCanvas" role="img" aria-label="物块 A 与板块 B 的速度-时间图像"></canvas>
        </section>
        <div class="control-panel">
            <section class="param-group" aria-labelledby="parameterTitle">
                <div class="group-title" id="parameterTitle">参数设定</div>
                <div class="param-row">
                    <label for="v0A">A 初速度 v₀A</label>
                    <input id="v0A" type="range" min="2" max="20" value="12" step="0.5">
                    <div class="val" id="v0AVal">12.0 m/s</div>
                </div>
                <div class="param-row">
                    <label for="mu">A-B 摩擦 μ₁</label>
                    <input id="mu" type="range" min="5" max="50" value="20" step="1">
                    <div class="val" id="muVal">0.20</div>
                </div>
                <div class="param-row">
                    <label for="mu2">B-地摩擦 μ₂</label>
                    <input id="mu2" type="range" min="0" max="50" value="0" step="1">
                    <div class="val" id="mu2Val">0.00</div>
                </div>
                <div class="param-row">
                    <label for="plateLen">板长 L</label>
                    <input id="plateLen" type="range" min="2" max="10" value="6" step="0.5">
                    <div class="val" id="plateLenVal">6.0 m</div>
                </div>
                <div class="param-row">
                    <label for="ts">动画速度</label>
                    <input id="ts" type="range" min="5" max="30" value="10" step="1">
                    <div class="val" id="tsVal">1.0×</div>
                </div>
            </section>
            <section class="data-group state-rows" aria-labelledby="dataTitle" aria-live="polite">
                <div class="group-title" id="dataTitle">速度显示（与 v-t 图同步）</div>
                <div class="param-row">
                    <label>物块 A vₐ</label>
                    <div class="val" id="dVA">— m/s</div>
                </div>
                <div class="param-row">
                    <label>板块 B vᵦ</label>
                    <div class="val" id="dVB">— m/s</div>
                </div>
                <div class="param-row">
                    <label>相对速度</label>
                    <div class="val" id="dVR">— m/s</div>
                </div>
                <div class="param-row">
                    <label>运动状态</label>
                    <div class="val" id="dState">待开始</div>
                </div>
            </section>
        </div>
        <div class="data-row">
            <div class="data-card"><span>共速时刻</span><div class="num" id="dTEnd">—</div></div>
            <div class="data-card"><span>共速后速度</span><div class="num" id="dVFinal">—</div></div>
            <div class="data-card"><span>相对位移（滑动阶段）</span><div class="num" id="dRelDisp">—</div></div>
            <div class="data-card"><span>是否滑出</span><div class="num" id="dSlideOff">—</div></div>
            <div class="data-card"><span>摩擦生热（总）</span><div class="num" id="dHeat">—</div></div>
        </div>
        <div class="actions">
            <button id="btnStart" type="button">开始</button>
            <button id="btnReset" type="button" disabled>重置</button>
        </div>
        <div class="status" id="status"></div>
        <div class="legend">
            <span>🟦 物块 A</span>
            <span>🟧 板块 B</span>
            <span style="color:#3399ff">— vₐ 蓝线</span>
            <span style="color:#ff9933">— vᵦ 橙线</span>
            <span>虚线：共速/滑出时刻</span>
        </div>
    </main>

    <script>
    (() => {
        // ========== DOM ==========
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');
        const graphCanvas = document.getElementById('graphCanvas');
        const gctx = graphCanvas.getContext('2d');

        const elVA0   = document.getElementById('v0A');
        const elMu    = document.getElementById('mu');
        const elMu2   = document.getElementById('mu2');
        const elL     = document.getElementById('plateLen');
        const elTs    = document.getElementById('ts');
        const elVA0Val = document.getElementById('v0AVal');
        const elMuVal  = document.getElementById('muVal');
        const elMu2Val = document.getElementById('mu2Val');
        const elLVal   = document.getElementById('plateLenVal');
        const elTsVal  = document.getElementById('tsVal');
        const elVA   = document.getElementById('dVA');
        const elVB   = document.getElementById('dVB');
        const elVR   = document.getElementById('dVR');
        const elState= document.getElementById('dState');
        const elTEnd = document.getElementById('dTEnd');
        const elVFin = document.getElementById('dVFinal');
        const elRel  = document.getElementById('dRelDisp');
        const elSlide= document.getElementById('dSlideOff');
        const elHeat = document.getElementById('dHeat');
        const elStatus = document.getElementById('status');
        const btnStart = document.getElementById('btnStart');
        const btnReset = document.getElementById('btnReset');

        const g = 9.8;
        const BASE_WIDTH = 880;
        const BASE_HEIGHT = 520;
        const GRAPH_WIDTH = 880;
        const GRAPH_HEIGHT = 200;
        const view  = { width: BASE_WIDTH, height: BASE_HEIGHT };
        const gview = { width: GRAPH_WIDTH, height: GRAPH_HEIGHT };

        // ========== 场景视图 ==========
        const PAD_X = 90;          // 板块左缘固定屏幕位置
        const PAD_RIGHT = 70;      // 右侧留白
        const PAD_BOTTOM = 58;     // 地面距画布底部
        const PLATE_H = 40;        // 板厚度（像素，轻薄长板形态）
        const BLOCK_H = 54;        // 物块高度（像素，较原 68px 下降 20%）

        // 自适应比例：板长 L 占据画面主要宽度（约 75%），不固定死像素
        function plateScale() {
            return Math.max(8, (view.width - PAD_X - PAD_RIGHT) / P.L * 0.92);
        }

        // ========== 物理参数 ==========
        const P = {
            mA: 2, mB: 4,          // kg，用于相对位移/热量计算
            v0A: 12,               // m/s（滑条可调 2–20 m/s）
            v0B: 0,                // m/s（固定为 0，板 B 静止）
            mu: 0.2,               // μ₁：A-B 间动摩擦因数（滑条 0.05–0.50）
            mu2: 0,                // μ₂：B-地面间动摩擦因数（滑条 0–0.50，默认 0）
            L: 6,                  // B 长度 m（滑条可调 2–10 m）
        };

        // ========== 物理计算（双摩擦：μ₁ = A-B，μ₂ = B-地面） ==========
        // 滑动阶段：A 减速 aA = μ₁g；B 受 A 摩擦（向前 μ₁mA·g）与地面摩擦（向后 μ₂(mA+mB)·g）。
        //   μ₁mA > μ₂(mA+mB)：B 加速 aB = [μ₁mA − μ₂(mA+mB)]g/mB；
        //   否则 B 保持静止（A 在静止板上滑动）。
        // 未滑出：共速后若 μ₁≥μ₂（静摩擦按 μ₁ 计）则锁死：μ₂=0 一起匀速，μ₂>0 一起匀减速 μ₂g。
        //         若 μ₁<μ₂ 则不能锁死，共速后继续相对滑动（当前 mA、mB、v0B=0 时，
        //         能带动 B 已蕴含 μ₁>μ₂(1+mB/mA)>μ₂，此分支为防守与教学展示）。
        // 滑出（S_rel 达 L）：A 在地面受 μ₂m_A·g、B 受 μ₂m_B·g 各自减速（μ₂=0 则各自匀速）。
        function physics() {
            const mu1 = P.mu, mu2 = P.mu2;
            const aA = mu1 * g;                                   // A 减速度
            const bMoved = mu1 * P.mA > mu2 * (P.mA + P.mB) + 1e-12; // B 能否被带动
            const aB = bMoved ? (mu1 * P.mA - mu2 * (P.mA + P.mB)) * g / P.mB : 0;
            const aRel = aA + aB;                                 // 相对减速度
            // 共速后要一起按 μ₂g 减速，A 所需静摩擦 f=mA μ₂ g，上限 μ₁ mA g ⇒ μ₁≥μ₂
            const canStick = mu1 + 1e-12 >= mu2;

            const t1 = P.v0A / aRel;                              // 滑动阶段时长（共速或 A 停止）
            const vCommon = aB * t1;                              // 共速速度（B 静止时为 0）
            const sRel1 = 0.5 * P.v0A * t1;                       // 滑动阶段相对位移总量
            const willSlideOff = sRel1 > P.L;

            let tOff = 0, vAOff = 0, vBOff = 0;
            if (willSlideOff) {
                // S_rel(t) = v0A·t − ½aRel·t² = L 的第一个根
                tOff = (P.v0A - Math.sqrt(Math.max(0, P.v0A * P.v0A - 2 * aRel * P.L))) / aRel;
                vAOff = P.v0A - aA * tOff;
                vBOff = aB * tOff;
            }

            // 阶段 1（滑动段）结束时刻的位移：滑出时以 tOff 计，未滑出时以 t1（共速/A 停）计
            const xB1 = willSlideOff ? 0.5 * aB * tOff * tOff : 0.5 * aB * t1 * t1;
            const xA1 = xB1 + (willSlideOff ? P.L : sRel1);

            // 共速后不能锁死时的二次滑动加速度（A 仍受向后 f₁，B 受向前 f₁ 与向后地面摩擦）
            const aA2 = mu1 * g;
            const aB2 = (mu1 * P.mA - mu2 * (P.mA + P.mB)) * g / P.mB;
            const slipAfter = !willSlideOff && bMoved && !canStick && mu2 > 0;

            // 总生热 = A-B 摩擦生热 + 地面摩擦生热
            const Q1 = mu1 * P.mA * g * Math.min(sRel1, P.L);
            let Q2 = 0;
            if (mu2 > 0) {
                Q2 += mu2 * (P.mA + P.mB) * g * xB1;              // 滑动阶段（A 压在 B 上）
                if (willSlideOff) {
                    Q2 += 0.5 * P.mB * vBOff * vBOff;             // 滑出后 B 滑行至停
                    Q2 += 0.5 * P.mA * vAOff * vAOff;             // 滑出后 A 在地面滑行至停
                } else if (bMoved) {
                    // 共速后无论锁死还是再次滑动，μ₂>0 时末动能均为 0，剩动能全部变热
                    Q2 += 0.5 * (P.mA + P.mB) * vCommon * vCommon;
                }
                // B 静止且 A 停在板上：无相对地面滑移，无地面生热
            }
            return { mu1, mu2, aA, aB, aRel, bMoved, canStick, slipAfter, aA2, aB2, t1, vCommon, sRel1, willSlideOff, tOff, vAOff, vBOff, xB1, xA1, heat: Q1 + Q2 };
        }

        // 指定时刻 t 的速度
        function velocities(t) {
            const ph = physics();
            if (t <= ph.t1) {
                return { vA: Math.max(0, P.v0A - ph.aA * t), vB: ph.aB * t, trans: false, off: false, stopped: false };
            }
            const dt = t - ph.t1;
            const dec = ph.mu2 * g;
            if (ph.willSlideOff) {
                // 滑出后：A、B 各自在地面摩擦下减速（μ₂=0 则匀速），两线不汇合
                return {
                    vA: Math.max(0, ph.vAOff - dec * dt),
                    vB: Math.max(0, ph.vBOff - dec * dt),
                    trans: false, off: true, stopped: false,
                };
            }
            if (!ph.bMoved) {
                // B 静止且 A 停在板上
                return { vA: 0, vB: 0, trans: true, off: false, stopped: 'plate' };
            }
            if (ph.slipAfter) {
                // μ₁<μ₂：静摩擦不够，共速后不能锁死，继续相对滑动
                const vA = Math.max(0, ph.vCommon - ph.aA2 * dt);
                const vB = Math.max(0, ph.vCommon + ph.aB2 * dt);
                const stopped = vA <= 0 && vB <= 0 ? 'slip-stop' : false;
                return { vA, vB, trans: false, off: false, stopped, slipAfter: true };
            }
            const vNow = Math.max(0, ph.vCommon - dec * dt);
            return { vA: vNow, vB: vNow, trans: true, off: false, stopped: ph.mu2 > 0 && vNow <= 0 ? 'together' : false };
        }

        // 指定时刻 t 的位置（含滑出/共速后各阶段）
        function positions(t) {
            const ph = physics();
            if (t <= ph.t1) {
                const bX = 0.5 * ph.aB * t * t;
                const sRel = Math.max(0, P.v0A * t - 0.5 * ph.aRel * t * t);
                return { bX, aX: bX + sRel, onPlate: true };
            }
            const dt = t - ph.t1;
            const dec = ph.mu2 * g;
            if (ph.willSlideOff) {
                const tauA = ph.mu2 > 0 ? Math.min(dt, ph.vAOff / dec) : dt;
                const tauB = ph.mu2 > 0 ? Math.min(dt, ph.vBOff / dec) : dt;
                const bX = ph.xB1 + ph.vBOff * tauB - 0.5 * dec * tauB * tauB;
                const aX = ph.xA1 + ph.vAOff * tauA - 0.5 * dec * tauA * tauA;
                return { bX, aX, onPlate: false };
            }
            if (!ph.bMoved) {
                return { bX: 0, aX: ph.xA1, onPlate: true };      // A 停在静止板上
            }
            if (ph.slipAfter) {
                const tauA = ph.aA2 > 0 ? Math.min(dt, ph.vCommon / ph.aA2) : dt;
                const tauB = ph.aB2 < 0 ? Math.min(dt, ph.vCommon / (-ph.aB2)) : dt;
                const bX = ph.xB1 + ph.vCommon * tauB + 0.5 * ph.aB2 * tauB * tauB;
                const aX = ph.xA1 + ph.vCommon * tauA - 0.5 * ph.aA2 * tauA * tauA;
                const sRel = aX - bX;
                return { bX, aX, onPlate: sRel < P.L - 1e-9 };
            }
            const tau = ph.mu2 > 0 ? Math.min(dt, ph.vCommon / dec) : dt;
            const bX = ph.xB1 + ph.vCommon * tau - 0.5 * dec * tau * tau;
            return { bX, aX: bX + ph.sRel1, onPlate: true };
        }

        // ========== 状态 ==========
        let state = 'idle'; // idle | running | ended
        let simT  = 0;
        let lastTs = null;
        let timeScale = 1;
        let animId = null;
        let velHist = [];   // [{t, vA, vB}]
        let slideOffTriggered = false;
        let lastDraw = null; // 最近一帧画面（供窗口缩放重绘）

        // ========== 绘制：运动场景 ==========
        function drawScene(t, drawA, drawB) {
            ctx.clearRect(0, 0, view.width, view.height);

            const s = plateScale();          // 像素/米，随板长自适应
            const camX = drawB.x;            // 相机跟随板块左缘，保证板不超出画布
            const groundY = view.height - PAD_BOTTOM;
            const SX = x => PAD_X + (x - camX) * s;

            // 水平网格
            ctx.strokeStyle = '#16222e';
            ctx.lineWidth = 1;
            for (let gy = groundY - 44; gy > 24; gy -= 44) {
                ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(view.width, gy); ctx.stroke();
            }
            // 竖直网格（每 1 米）
            const wLeft  = camX - PAD_X / s;
            const wRight = camX + (view.width - PAD_X) / s;
            for (let m = Math.ceil(wLeft); m <= wRight; m++) {
                const x = SX(m);
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, groundY); ctx.stroke();
            }

            // 地面
            ctx.strokeStyle = '#3a4a5a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(view.width, groundY);
            ctx.stroke();

            // 地面距离标注（随可视范围自适应步长）
            const labelStep = s >= 90 ? 2 : (s >= 40 ? 5 : 10);
            ctx.fillStyle = '#556677';
            ctx.font = '11px system-ui';
            ctx.textAlign = 'center';
            for (let m = Math.ceil(wLeft / labelStep) * labelStep; m <= wRight; m += labelStep) {
                ctx.fillText(m + 'm', SX(m), groundY + 18);
            }

            // 板块 B（长度 = P.L，占画面醒目宽度）
            const bLeft  = SX(drawB.x);
            const bRight = SX(drawB.x + P.L);
            const bTop   = groundY - PLATE_H;
            const bBot   = groundY;

            // 阴影
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(bLeft + 4, bBot + 3, bRight - bLeft, 7);

            // 主体（橙色渐变，强化与物块的对比）
            const bg = ctx.createLinearGradient(bLeft, bTop, bLeft, bBot);
            bg.addColorStop(0, '#dd8833');
            bg.addColorStop(0.6, '#bb6600');
            bg.addColorStop(1, '#7a3d00');
            ctx.fillStyle = bg;
            ctx.fillRect(bLeft, bTop, bRight - bLeft, bBot - bTop);

            // 边框
            ctx.strokeStyle = '#ffaa44';
            ctx.lineWidth = 2;
            ctx.strokeRect(bLeft, bTop, bRight - bLeft, bBot - bTop);

            // 粗糙面纹理线
            ctx.strokeStyle = 'rgba(255,255,255,0.14)';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 3; i++) {
                const ly = bTop + (bBot - bTop) * i / 4;
                ctx.beginPath();
                ctx.moveTo(bLeft + 5, ly);
                ctx.lineTo(bRight - 5, ly);
                ctx.stroke();
            }

            // 板块标签（薄板：单行紧凑标注）
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 11px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText(`板块 B · vᵦ = ${drawB.v.toFixed(1)} m/s · L = ${P.L.toFixed(1)} m`, (bLeft + bRight) / 2, bTop + 25);

            // 物块 A（宽度 = 板长 12%，较上一版再缩短一半，比例协调）
            const blockWm = P.L * 0.12;
            const blockW = blockWm * s;

            if (drawA.onPlate) {
                const aLeft = SX(drawA.x);
                const aTop  = bTop - BLOCK_H;
                const aBot  = bTop;

                // 阴影
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(aLeft + 3, aBot + 3, blockW, 5);

                // 主体（蓝色渐变）
                const ag = ctx.createLinearGradient(aLeft, aTop, aLeft, aBot);
                ag.addColorStop(0, '#4db8ff');
                ag.addColorStop(1, '#1170cc');
                ctx.fillStyle = ag;
                ctx.fillRect(aLeft, aTop, blockW, aBot - aTop);

                ctx.strokeStyle = '#7dd0ff';
                ctx.lineWidth = 2;
                ctx.strokeRect(aLeft, aTop, blockW, aBot - aTop);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('物块 A', aLeft + blockW / 2, aTop + 19);
                ctx.fillStyle = '#cceaff';
                ctx.font = '10px system-ui';
                ctx.fillText(`${drawA.v.toFixed(1)} m/s`, aLeft + blockW / 2, aTop + 37);
            } else {
                // 滑出后：A 以小圆点在地面继续显示（超出右缘时贴边）
                const ax = Math.min(SX(drawA.x), view.width - 28);
                const ay = groundY - 24;
                ctx.fillStyle = '#3388cc';
                ctx.beginPath();
                ctx.arc(ax, ay, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#7dd0ff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#eaf6ff';
                ctx.font = 'bold 11px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('A', ax, ay + 4);
            }

            // 摩擦箭头（A 在 B 上滑动时，方向与 A 相对 B 的滑动方向相反）
            if (drawA.onPlate && Math.abs(drawA.v - drawB.v) > 0.05) {
                const midX = SX(drawA.x) + blockW / 2;
                const midY = bTop - BLOCK_H - 16;
                const arrowDir = drawA.v > drawB.v ? -1 : 1;
                ctx.strokeStyle = '#ffdd57';
                ctx.fillStyle = '#ffdd57';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(midX - 10 * arrowDir, midY);
                ctx.lineTo(midX + 10 * arrowDir, midY);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(midX + 10 * arrowDir, midY);
                ctx.lineTo(midX + 4 * arrowDir, midY - 5);
                ctx.lineTo(midX + 4 * arrowDir, midY + 5);
                ctx.closePath();
                ctx.fill();
                ctx.font = '11px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('f', midX + arrowDir * 18, midY + 4);
            }
        }

        // ========== 绘制：v-t 图 ==========
        function drawGraph() {
            const w = gview.width, h = gview.height;
            gctx.clearRect(0, 0, w, h);

            const padL = 50, padR = 18, padT = 16, padB = 32;
            const plotW = w - padL - padR;
            const plotH = h - padT - padB;

            // 坐标轴
            gctx.strokeStyle = '#7b8ea3';
            gctx.lineWidth = 2;
            gctx.beginPath();
            gctx.moveTo(padL, padT);
            gctx.lineTo(padL, padT + plotH);
            gctx.lineTo(padL + plotW, padT + plotH);
            gctx.stroke();

            if (velHist.length < 2) {
                gctx.fillStyle = '#44586c';
                gctx.font = '12px system-ui';
                gctx.textAlign = 'center';
                gctx.fillText('开始后将显示 v-t 图', w / 2, h / 2);
                return;
            }

            const ph = physics();
            // 预估完整观测时长：坐标轴从一开始即覆盖全程，播放头同步不跳变
            let tPred;
            if (ph.willSlideOff) {
                tPred = ph.mu2 > 0 ? ph.t1 + Math.max(ph.vAOff, ph.vBOff) / (ph.mu2 * g) + 2 : ph.t1 + 6;
            } else if (!ph.bMoved) {
                tPred = ph.t1 + 2;
            } else {
                tPred = ph.mu2 > 0 ? ph.t1 + ph.vCommon / (ph.mu2 * g) + 2 : ph.t1 + 6;
            }
            const tMax = Math.max(tPred, 6, ...velHist.map(p => p.t));
            const vMax = Math.max(P.v0A, 1) * 1.25;

            const TX = t => padL + (t / tMax) * plotW;
            const VY = v => padT + plotH - (v / vMax) * plotH;

            // 网格
            gctx.strokeStyle = '#1f2d3d';
            gctx.lineWidth = 1;
            const tStep = tMax <= 6 ? 1 : 2;
            for (let t = 0; t <= tMax; t += tStep) {
                const x = TX(t);
                gctx.beginPath(); gctx.moveTo(x, padT); gctx.lineTo(x, padT + plotH); gctx.stroke();
                gctx.fillStyle = '#8899aa';
                gctx.font = '10px system-ui';
                gctx.textAlign = 'center';
                gctx.fillText(t.toFixed(0) + 's', x, padT + plotH + 14);
            }
            const vStep = vMax <= 15 ? 5 : 10;
            for (let v = 0; v <= vMax; v += vStep) {
                const y = VY(v);
                gctx.beginPath(); gctx.moveTo(padL, y); gctx.lineTo(padL + plotW, y); gctx.stroke();
                gctx.fillStyle = '#8899aa';
                gctx.font = '10px system-ui';
                gctx.textAlign = 'right';
                gctx.fillText(v.toFixed(0), padL - 5, y + 3);
            }

            // 共速竖线（未滑出时，含 A 停在静止板上情形） / 滑出转折竖线（滑出时）
            if (!ph.willSlideOff && ph.t1 <= tMax) {
                gctx.strokeStyle = 'rgba(255,255,255,0.18)';
                gctx.setLineDash([4, 4]);
                gctx.beginPath();
                gctx.moveTo(TX(ph.t1), padT);
                gctx.lineTo(TX(ph.t1), padT + plotH);
                gctx.stroke();
                gctx.setLineDash([]);
                gctx.fillStyle = ph.bMoved ? '#ffaa22' : '#33dd66';
                gctx.font = '10px system-ui';
                gctx.textAlign = 'center';
                gctx.fillText(
                    !ph.bMoved ? 'A 停' : (ph.slipAfter ? '共速后滑' : '共速 ' + ph.vCommon.toFixed(1)),
                    TX(ph.t1), padT + 10
                );
            } else if (ph.willSlideOff && ph.tOff <= tMax) {
                gctx.strokeStyle = 'rgba(255,102,68,0.35)';
                gctx.setLineDash([4, 4]);
                gctx.beginPath();
                gctx.moveTo(TX(ph.tOff), padT);
                gctx.lineTo(TX(ph.tOff), padT + plotH);
                gctx.stroke();
                gctx.setLineDash([]);
                gctx.fillStyle = '#ff8866';
                gctx.font = '10px system-ui';
                gctx.textAlign = 'center';
                gctx.fillText('滑出', TX(ph.tOff), padT + 10);
            }

            // 曲线 A
            gctx.strokeStyle = '#3399ff';
            gctx.lineWidth = 2;
            gctx.lineJoin = 'round';
            gctx.beginPath();
            gctx.moveTo(TX(velHist[0].t), VY(velHist[0].vA));
            for (let i = 1; i < velHist.length; i++) {
                gctx.lineTo(TX(velHist[i].t), VY(velHist[i].vA));
            }
            gctx.stroke();

            // 曲线 B
            gctx.strokeStyle = '#ff9933';
            gctx.lineWidth = 2;
            gctx.beginPath();
            gctx.moveTo(TX(velHist[0].t), VY(velHist[0].vB));
            for (let i = 1; i < velHist.length; i++) {
                gctx.lineTo(TX(velHist[i].t), VY(velHist[i].vB));
            }
            gctx.stroke();

            // 播放头（当前时刻同步标记）
            const last = velHist[velHist.length - 1];
            const pxNow = TX(Math.min(last.t, tMax));
            gctx.strokeStyle = 'rgba(51, 136, 221, 0.4)';
            gctx.lineWidth = 1;
            gctx.beginPath();
            gctx.moveTo(pxNow, padT);
            gctx.lineTo(pxNow, padT + plotH);
            gctx.stroke();
            gctx.fillStyle = '#3399ff';
            gctx.beginPath(); gctx.arc(pxNow, VY(last.vA), 3.5, 0, Math.PI * 2); gctx.fill();
            gctx.fillStyle = '#ff9933';
            gctx.beginPath(); gctx.arc(pxNow, VY(last.vB), 3.5, 0, Math.PI * 2); gctx.fill();

            // 轴标签
            gctx.fillStyle = '#8899aa';
            gctx.font = '11px system-ui';
            gctx.textAlign = 'center';
            gctx.fillText('t (s)', padL + plotW / 2, h - 4);
            gctx.save();
            gctx.translate(9, padT + plotH / 2);
            gctx.rotate(-Math.PI / 2);
            gctx.fillText('v (m/s)', 0, 0);
            gctx.restore();

            // 图例
            gctx.textAlign = 'left';
            gctx.fillStyle = '#3399ff';
            gctx.fillRect(padL + 6, padT + 22, 14, 3);
            gctx.fillStyle = '#8899aa';
            gctx.font = '10px system-ui';
            gctx.fillText('vₐ', padL + 24, padT + 28);
            gctx.fillStyle = '#ff9933';
            gctx.fillRect(padL + 52, padT + 22, 14, 3);
            gctx.fillStyle = '#8899aa';
            gctx.fillText('vᵦ', padL + 70, padT + 28);
        }

        // ========== 动画帧 ==========
        function frame(ts) {
            if (state !== 'running') return;
            if (lastTs === null) lastTs = ts;
            const rawDt = (ts - lastTs) / 1000;
            lastTs = ts;
            const dt = Math.min(rawDt, 0.05) * timeScale;
            simT += dt;

            const ph = physics();
            const vel = velocities(simT);
            const pos = positions(simT);
            const onPlate = pos.onPlate;

            if (ph.willSlideOff && !onPlate && !slideOffTriggered) {
                slideOffTriggered = true;
                elStatus.textContent = '⚠ 物块 A 已滑出板块 B，两者以各自速度继续运动...';
            }

            // 结束条件：转折后仍在运动则再观察 6 秒、已停止再观察 2 秒；总时长上限 30 秒
            const stillMoving = vel.vA > 0.001 || vel.vB > 0.001;
            if (simT - ph.t1 > (stillMoving ? 6 : 2)) {
                endSim();
                return;
            }
            if (simT > 30) {
                endSim();
                return;
            }

            const drawB = { x: pos.bX, v: vel.vB };
            const drawA = { x: pos.aX, v: vel.vA, onPlate: onPlate };
            lastDraw = { drawA, drawB };

            drawScene(simT, drawA, drawB);

            // 速度历史
            velHist.push({ t: simT, vA: vel.vA, vB: vel.vB });

            // 更新数字
            elVA.textContent  = vel.vA.toFixed(2) + ' m/s';
            elVB.textContent  = vel.vB.toFixed(2) + ' m/s';
            elVR.textContent  = Math.abs(vel.vA - vel.vB).toFixed(2) + ' m/s';
            if (vel.off) {
                elState.textContent = 'A 已滑出（各自运动）';
                elState.style.color = '#ff6644';
            } else if (vel.stopped === 'plate') {
                elState.textContent = 'A 停在板上（B 静止）';
                elState.style.color = '#33dd66';
            } else if (vel.stopped === 'together') {
                elState.textContent = '共同停止';
                elState.style.color = '#aab';
            } else if (vel.stopped === 'slip-stop') {
                elState.textContent = '再次滑动后停止';
                elState.style.color = '#aab';
            } else if (vel.slipAfter) {
                elState.textContent = 'μ₁<μ₂，共速后再次滑动';
                elState.style.color = '#ffdd57';
            } else if (vel.trans) {
                elState.textContent = '共速一起运动';
                elState.style.color = '#ffaa22';
            } else {
                elState.textContent = 'A 在 B 上滑动';
                elState.style.color = '#3399ff';
            }

            drawGraph();
            animId = requestAnimationFrame(frame);
        }

        function endSim() {
            state = 'ended';
            if (animId) { cancelAnimationFrame(animId); animId = null; }

            const ph = physics();
            const pos = positions(simT);
            const vel = velocities(simT);

            const drawB = { x: pos.bX, v: vel.vB };
            const drawA = { x: pos.aX, v: vel.vA, onPlate: pos.onPlate };
            lastDraw = { drawA, drawB };

            drawScene(simT, drawA, drawB);
            drawGraph();

            elState.textContent = '结束';
            elState.style.color = '#aab';
            btnStart.disabled = true;
            btnReset.disabled = false;
            let msg;
            if (ph.willSlideOff) {
                msg = ph.mu2 > 0
                    ? `物块 A 于 t = ${ph.tOff.toFixed(2)} s 滑出板块，随后 A、B 均在地面摩擦下减速停止。`
                    : `物块 A 于 t = ${ph.tOff.toFixed(2)} s 滑出板块，A、B 分别以 ${ph.vAOff.toFixed(2)} m/s 与 ${ph.vBOff.toFixed(2)} m/s 匀速运动。`;
            } else if (!ph.bMoved) {
                msg = `地面摩擦足够大（μ₁ mA ≤ μ₂(mA+mB)），B 保持静止；物块 A 在板上滑行 ${ph.sRel1.toFixed(2)} m 后停下。`;
            } else if (ph.slipAfter) {
                msg = `两者于 t = ${ph.t1.toFixed(2)} s 达到共同速度 ${ph.vCommon.toFixed(2)} m/s，但 μ₁ < μ₂，静摩擦不足以锁死，随后再次相对滑动。`;
            } else if (ph.mu2 > 0) {
                msg = `两者于 t = ${ph.t1.toFixed(2)} s 达到共同速度 ${ph.vCommon.toFixed(2)} m/s（μ₁≥μ₂，可锁死），随后一起匀减速停止。`;
            } else {
                msg = `物块 A 与板块 B 达到共同速度 ${ph.vCommon.toFixed(2)} m/s，一起匀速运动。`;
            }
            elStatus.textContent = msg;
        }

        // ========== 自适应尺寸 ==========
        function setupCanvas(canvasEl, viewObj, baseW, baseH) {
            const cssWidth = canvasEl.clientWidth || baseW;
            const cssHeight = cssWidth * baseH / baseW;
            const devicePixelRatio = window.devicePixelRatio || 1;
            canvasEl.width = Math.round(cssWidth * devicePixelRatio);
            canvasEl.height = Math.round(cssHeight * devicePixelRatio);
            canvasEl.getContext('2d').setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
            viewObj.width = cssWidth;
            viewObj.height = cssHeight;
        }

        function resizeAll() {
            setupCanvas(canvas, view, BASE_WIDTH, BASE_HEIGHT);
            setupCanvas(graphCanvas, gview, GRAPH_WIDTH, GRAPH_HEIGHT);
            if (lastDraw) {
                drawScene(simT, lastDraw.drawA, lastDraw.drawB);
            } else {
                drawScene(0, { x: 0, v: P.v0A, onPlate: true }, { x: 0, v: P.v0B });
            }
            drawGraph();
        }

        // ========== 数据面板 ==========
        function updateDataPanel() {
            const ph = physics();
            elTEnd.textContent = ph.willSlideOff ? '—' : ph.t1.toFixed(2) + ' s';
            elVFin.textContent = ph.willSlideOff ? '—' : ph.vCommon.toFixed(2) + ' m/s';
            elRel.textContent  = ph.sRel1.toFixed(2) + ' m';
            elSlide.textContent = ph.willSlideOff ? '✓ 滑出' : '✗ 未滑出';
            elSlide.style.color = ph.willSlideOff ? '#ff6644' : '#33dd66';
            elHeat.textContent = ph.heat.toFixed(2) + ' J';
            if (state === 'idle') {
                if (!ph.bMoved) {
                    elStatus.textContent = '当前参数：μ₁ mA ≤ μ₂(mA+mB)，板 B 不会被带动。';
                } else if (!ph.canStick && ph.mu2 > 0) {
                    elStatus.textContent = '当前参数：μ₁ < μ₂，共速后静摩擦不足以锁死，将再次相对滑动。';
                } else {
                    elStatus.textContent = ph.mu2 > 0
                        ? '当前参数：μ₁≥μ₂ 且能带动 B，共速后将锁死并一起减速。'
                        : '';
                }
            }
        }

        // ========== 控制 ==========
        function start() {
            if (state === 'running') return;
            reset(true);

            const ph = physics();
            state = 'idle';
            simT = 0;
            lastTs = null;
            velHist = [{ t: 0, vA: P.v0A, vB: P.v0B }];
            slideOffTriggered = false;
            elStatus.textContent = '';

            updateDataPanel();

            state = 'running';
            btnStart.disabled = true;
            btnReset.disabled = false;
            elVA0.disabled = true;
            elMu.disabled = true;
            elMu2.disabled = true;
            elL.disabled = true;
            elTs.disabled = true;

            const drawA = { x: 0, v: P.v0A, onPlate: true };
            const drawB = { x: 0, v: P.v0B };
            lastDraw = { drawA, drawB };
            drawScene(0, drawA, drawB);
            drawGraph();

            animId = requestAnimationFrame(frame);
        }

        function reset(silent) {
            if (animId) { cancelAnimationFrame(animId); animId = null; }
            state = 'idle';
            simT = 0;
            lastTs = null;
            velHist = [];
            slideOffTriggered = false;

            P.v0A = parseFloat(elVA0.value) || 12;
            P.v0B = 0;
            P.mu  = parseFloat(elMu.value) / 100;
            P.mu2 = parseFloat(elMu2.value) / 100;
            P.L   = parseFloat(elL.value) || 6;
            timeScale = parseFloat(elTs.value) / 10;

            elVA0Val.textContent = P.v0A.toFixed(1) + ' m/s';
            elMuVal.textContent = P.mu.toFixed(2);
            elMu2Val.textContent = P.mu2.toFixed(2);
            elLVal.textContent = P.L.toFixed(1) + ' m';
            elTsVal.textContent = timeScale.toFixed(1) + '×';

            elVA.textContent = P.v0A.toFixed(2) + ' m/s';
            elVB.textContent = P.v0B.toFixed(2) + ' m/s';
            elVR.textContent = '—';
            elState.textContent = '待开始';
            elState.style.color = '#99aabb';
            elStatus.textContent = '';
            elVA0.disabled = false;
            elMu.disabled = false;
            elMu2.disabled = false;
            elL.disabled = false;
            elTs.disabled = false;

            updateDataPanel();

            btnStart.disabled = false;
            btnReset.disabled = true;

            const drawA = { x: 0, v: P.v0A, onPlate: true };
            const drawB = { x: 0, v: P.v0B };
            lastDraw = { drawA, drawB };
            drawScene(0, drawA, drawB);
            drawGraph();
        }

        // ========== 事件绑定 ==========
        elVA0.addEventListener('input', () => {
            P.v0A = parseFloat(elVA0.value);
            elVA0Val.textContent = P.v0A.toFixed(1) + ' m/s';
            if (state === 'idle') {
                elVA.textContent = P.v0A.toFixed(2) + ' m/s';
                updateDataPanel();
                const drawA = { x: 0, v: P.v0A, onPlate: true };
                const drawB = { x: 0, v: P.v0B };
                lastDraw = { drawA, drawB };
                drawScene(0, drawA, drawB);
            }
        });

        elMu.addEventListener('input', () => {
            P.mu = parseFloat(elMu.value) / 100;
            elMuVal.textContent = P.mu.toFixed(2);
            if (state === 'idle') {
                updateDataPanel();
            }
        });

        elMu2.addEventListener('input', () => {
            P.mu2 = parseFloat(elMu2.value) / 100;
            elMu2Val.textContent = P.mu2.toFixed(2);
            if (state === 'idle') {
                updateDataPanel();
            }
        });

        elL.addEventListener('input', () => {
            P.L = parseFloat(elL.value);
            elLVal.textContent = P.L.toFixed(1) + ' m';
            if (state === 'idle') {
                updateDataPanel();
                const drawA = { x: 0, v: P.v0A, onPlate: true };
                const drawB = { x: 0, v: P.v0B };
                lastDraw = { drawA, drawB };
                drawScene(0, drawA, drawB);
            }
        });

        elTs.addEventListener('input', () => {
            timeScale = parseFloat(elTs.value) / 10;
            elTsVal.textContent = timeScale.toFixed(1) + '×';
        });

        btnStart.addEventListener('click', start);
        btnReset.addEventListener('click', () => reset(false));
        window.addEventListener('resize', resizeAll);
        if (typeof ResizeObserver !== 'undefined') {
            const observer = new ResizeObserver(resizeAll);
            observer.observe(canvas);
            observer.observe(graphCanvas);
        }

        // ========== 启动 ==========
        resizeAll();
        reset(true);
    })();
    </script>
</body>
</html>

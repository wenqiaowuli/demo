<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
    文件描述：板块运动演示（通用版 v3）
    物理内容：展示物块 A 在板块 B 上的相对滑动、共速、滑出及摩擦生热等完整过程，
              双摩擦系数建模（μ₁ = A-B 之间，μ₂ = B-地面之间，μ₂ 默认 0）。
              共速后按 μ_s=μ₁ 判断能否锁死：需 μ₁≥μ₂ 才能一起减速，否则继续相对滑动。
              支持 A、B 双初速度（v0B 可为负值，即反向），A、B 质量可调。
              事件驱动精确积分：每步解析求解，v-t 图从预计算序列回放。
    v3 变更：物块 A 固定 2.0 m 正方形（不随板长/运动变化）；
              正方向向右，v₀B 默认 +2.0 m/s（A、B 默认均向右运动）；
              固定运动区域 [-10 m, +40 m]、固定比例尺（不动态取景），
              物体未停止而完全越出区域 -> 整个演示立即结束。
    适用场景：高中物理"板块模型"教学，可调 v₀A、v₀B、m_A、m_B、双动摩擦因数与板长 L，
              实时显示 v-t 图、相对位移、摩擦生热等数据，支持物块滑出后继续运动的情景。
    风格：与斜抛运动演示网页（oblique-throw-motion.html）统一的深色系列。
    -->
    <title>板块运动演示｜高中物理</title>
    <meta name="description" content="高中物理板块模型教学演示：可调 v₀A、v₀B、m_A、m_B、双动摩擦因数及板长，实时显示 v-t 图、共速时刻、相对位移、是否滑出与总摩擦生热。支持反向运动。">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 12px 32px;
        }
        main {
            width: 100%;
            max-width: 880px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 12px;
            text-align: center;
        }
        .canvas-wrap { width: 100%; }
        canvas {
            display: block;
            width: 100%;
            border: 2px solid #3388dd;
            border-radius: 10px;
            background-color: #0b1828;
        }
        canvas#scene { aspect-ratio: 880 / 520; }
        .charts-row {
            margin-top: 16px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 720px) {
            .charts-row { grid-template-columns: 1fr; }
        }
        .chart-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px 16px;
        }
        .chart-panel canvas {
            aspect-ratio: 20 / 9;
            border-width: 2px;
        }
        .group-title {
            font-size: 12px;
            color: #8899aa;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .control-panel {
            margin-top: 14px;
            width: 100%;
            display: grid;
            grid-template-columns: minmax(240px, 1fr) minmax(280px, 1.25fr);
            gap: 14px;
        }
        @media (max-width: 720px) {
            .control-panel { grid-template-columns: 1fr; }
        }
        .param-group,
        .data-group {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px 16px;
        }
        .param-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 10px;
        }
        .param-row:last-child { margin-bottom: 0; }
        .param-row label {
            font-size: 13px;

            white-space: nowrap;
            min-width: 96px;
        }
        .param-row input[type=range] { flex: 1; }
        .param-row .val {
            min-width: 64px;

            color: #ccd;

            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 9px;
        }
        @media (max-width: 560px) {
            .data-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        .data-item {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 10px;
        }
        .data-item span {
            display: block;
            font-size: 11px;
            color: #8899aa;
            margin-bottom: 4px;
        }
        .data-item b {
            display: block;

            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }
        .actions {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #3388dd;
            border: none;
            color: white;
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.15s ease, transform 0.15s ease;
        }
        button:hover:not(:disabled) { background: #2f7cc8; }
        button:active:not(:disabled) { transform: translateY(1px); }
        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #99aabb;
            text-align: center;
            min-height: 16px;
        }
        .legend {
            margin-top: 12px;
            font-size: 12px;
            color: #aab;
            text-align: center;
            line-height: 1.8;
        }
        .legend span { margin: 0 6px; }
    </style>
</head>
<body>
    <main>
        <h1>板块运动演示</h1>
        <div class="canvas-wrap">
            <canvas id="scene" role="img" aria-label="板块运动演示：物块 A 在板块 B 上相对滑动"></canvas>
        </div>
        <div class="charts-row">
            <section class="chart-panel">
                <div class="group-title">速度-时间图 (v-t)</div>
                <canvas id="graphCanvas" role="img" aria-label="物块 A 与板块 B 的速度-时间图像"></canvas>
            </section>
            <section class="chart-panel">
                <div class="group-title">位移-时间图 (s-t)</div>
                <canvas id="stChart" role="img" aria-label="物块 A 与板块 B 的位移-时间图像"></canvas>
            </section>
        </div>
        <div class="control-panel">
            <section class="param-group" aria-labelledby="parameterTitle">
                <div class="group-title" id="parameterTitle">参数设定</div>
                <div class="param-row">
                    <label for="v0A">A 初速度 v₀A</label>
                    <input id="v0A" type="range" min="2" max="20" value="12" step="0.5">
                    <div class="val" id="v0AVal">12.0 m/s</div>
                </div>
                <div class="param-row">
                    <label for="v0B">B 初速度 v₀B</label>
                    <input id="v0B" type="range" min="-100" max="100" value="20" step="5">
                    <div class="val" id="v0BVal">2.0 m/s</div>
                </div>
                <div class="param-row">
                    <label for="mA">A 质量 m<sub>A</sub></label>
                    <input id="mA" type="range" min="10" max="50" value="20" step="1">
                    <div class="val" id="mAVal">2.0 kg</div>
                </div>
                <div class="param-row">
                    <label for="mB">B 质量 m<sub>B</sub></label>
                    <input id="mB" type="range" min="10" max="100" value="40" step="1">
                    <div class="val" id="mBVal">4.0 kg</div>
                </div>
                <div class="param-row">
                    <label for="mu">A-B 摩擦 μ₁</label>
                    <input id="mu" type="range" min="5" max="50" value="20" step="1">
                    <div class="val" id="muVal">0.20</div>
                </div>
                <div class="param-row">
                    <label for="mu2">B-地摩擦 μ₂</label>
                    <input id="mu2" type="range" min="0" max="50" value="0" step="1">
                    <div class="val" id="mu2Val">0.00</div>
                </div>
                <div class="param-row">
                    <label for="plateLen">板长 L</label>
                    <input id="plateLen" type="range" min="2" max="10" value="6" step="0.5">
                    <div class="val" id="plateLenVal">6.0 m</div>
                </div>
                <div class="param-row">
                    <label for="ts">动画速度</label>
                    <input id="ts" type="range" min="5" max="30" value="10" step="1">
                    <div class="val" id="tsVal">1.0×</div>
                </div>
            </section>
            <section class="data-group" aria-labelledby="dataTitle" aria-live="polite">
                <div class="group-title" id="dataTitle">实时数据显示</div>
                <div class="data-grid">
                    <div class="data-item"><span>物块 A v<sub>A</sub></span><b id="dVA">— m/s</b></div>
                    <div class="data-item"><span>板块 B v<sub>B</sub></span><b id="dVB">— m/s</b></div>
                    <div class="data-item"><span>相对速度</span><b id="dVR">— m/s</b></div>
                    <div class="data-item"><span>运动状态</span><b id="dState">待开始</b></div>
                    <div class="data-item"><span>共速时刻</span><b id="dTEnd">—</b></div>
                    <div class="data-item"><span>共速后速度</span><b id="dVFinal">—</b></div>
                    <div class="data-item"><span>相对滑移</span><b id="dRelDisp">—</b></div>
                    <div class="data-item"><span>是否滑出</span><b id="dSlideOff">—</b></div>
                    <div class="data-item"><span>摩擦生热（总）</span><b id="dHeat">—</b></div>
                    <div class="data-item"><span>质量 (m<sub>A</sub>+m<sub>B</sub>)</span><b id="dMass">—</b></div>
                </div>
            </section>
        </div>
        <div class="actions">
            <button id="btnStart" type="button">开始</button>
            <button id="btnReset" type="button" disabled>重置</button>
        </div>
        <div class="status" id="status"></div>
        <div class="legend">
            <span>🟦 物块 A</span>
            <span>🟧 板块 B</span>
            <span style="color:#3399ff">— v<sub>A</sub>/s<sub>A</sub> 蓝线</span>
            <span style="color:#ff9933">— v<sub>B</sub>/s<sub>B</sub> 橙线</span>
            <span style="color:#ffdd57">→ f₁（A-B）</span>
            <span style="color:#ff6644">→ f₂（地面）</span>
            <span>虚线：共速/滑出时刻（v-t 与 s-t 同步）</span>
        </div>
    </main>

    <script>
    (() => {
        // ========== DOM ==========
        const canvas = document.getElementById('scene');
        const ctx = canvas.getContext('2d');
        const graphCanvas = document.getElementById('graphCanvas');
        const gctx = graphCanvas.getContext('2d');
        const stCanvas = document.getElementById('stChart');
        const stctx = stCanvas.getContext('2d');

        const elV0A   = document.getElementById('v0A');
        const elV0B   = document.getElementById('v0B');
        const elMA    = document.getElementById('mA');
        const elMB    = document.getElementById('mB');
        const elMu    = document.getElementById('mu');
        const elMu2   = document.getElementById('mu2');
        const elL     = document.getElementById('plateLen');
        const elTs    = document.getElementById('ts');
        const elV0AVal = document.getElementById('v0AVal');
        const elV0BVal = document.getElementById('v0BVal');
        const elMAVal  = document.getElementById('mAVal');
        const elMBVal  = document.getElementById('mBVal');
        const elMuVal  = document.getElementById('muVal');
        const elMu2Val = document.getElementById('mu2Val');
        const elLVal   = document.getElementById('plateLenVal');
        const elTsVal  = document.getElementById('tsVal');
        const elVA   = document.getElementById('dVA');
        const elVB   = document.getElementById('dVB');
        const elVR   = document.getElementById('dVR');
        const elState= document.getElementById('dState');
        const elTEnd = document.getElementById('dTEnd');
        const elVFin = document.getElementById('dVFinal');
        const elRel  = document.getElementById('dRelDisp');
        const elSlide= document.getElementById('dSlideOff');
        const elHeat = document.getElementById('dHeat');
        const elMass = document.getElementById('dMass');
        const elStatus = document.getElementById('status');
        const btnStart = document.getElementById('btnStart');
        const btnReset = document.getElementById('btnReset');

        const g = 9.8;
        const BASE_WIDTH = 880;
        const BASE_HEIGHT = 520;
        const GRAPH_WIDTH = 440;
        const GRAPH_HEIGHT = 198;
        const view  = { width: BASE_WIDTH, height: BASE_HEIGHT };
        const gview = { width: GRAPH_WIDTH, height: GRAPH_HEIGHT };
        const sview = { width: GRAPH_WIDTH, height: GRAPH_HEIGHT };

        // ========== 场景视图 ==========
        const PAD_X = 90;
        const PAD_RIGHT = 70;
        const PAD_BOTTOM = 58;
        const PLATE_H = 24;

        // ========== v3 需求 ==========
        // 需求一：物块 A 世界尺寸固定 2.0 m（正方形），不随板长/运动/缩放变化
        const BLOCK_W_M = 2.0;
        // 需求三：固定运动区域（世界坐标），比例尺固定，不再动态取景；
        // 任一物体未停止而完全越出区域 -> 整个演示立即结束
        const REGION_MIN = -10;
        const REGION_MAX = 40;

        function viewScale() {
            return (view.width - PAD_X - PAD_RIGHT) / (REGION_MAX - REGION_MIN);
        }

        // ========== 物理参数 ==========
        const P = {
            mA: 2, mB: 4,
            v0A: 12,
            v0B: 2,
            mu: 0.2,
            mu2: 0,
            L: 6,
        };

        // ========== 事件驱动精确积分预仿真 ==========
        function simulate() {
            const { mA, mB, v0A, v0B, mu: mu1, mu2, L } = P;
            const bw = BLOCK_W_M;
            const T_CAP = 32;
            const dtMax = 0.02;
            let t = 0;
            let xB = 0;
            let xA = v0A >= v0B ? 0 : L - bw;
            let sRel = xA - xB;
            let vA = v0A, vB = v0B;
            let onPlate = true;
            let locked = (Math.abs(vA - vB) < 1e-9);
            let sigma = Math.sign(vA - vB) || 1;
            let slipAfter = false;
            let t1 = null, vCommon = null, sRel1 = null;
            let tOff = null, offEdge = null;
            let tCenter = null, centerEvent = false, centerEdge = null;
            let tStop = null;
            let sRelStart = sRel;
            let Q = 0;
            let bMovedEver = Math.abs(v0B) > 1e-9;
            let horizon = Infinity;

            // 初始共速：需满足 μ₁≥μ₂ 才能锁死；否则立即再次相对滑动（slipAfter）
            if (locked) {
                t1 = 0;
                vCommon = vA;
                sRel1 = 0;
                if (mu2 > 0 && mu1 < mu2) {
                    locked = false;
                    slipAfter = true;
                    sigma = Math.sign(vA) || 1;
                }
            }
            const T = [], VA = [], VB = [], XA = [], XB = [], ON = [];

            let tExit = null, exitObjs = [];
            const rec = () => {
                T.push(t);
                VA.push(vA);
                VB.push(vB);
                XA.push(xA);
                XB.push(xB);
                ON.push(onPlate ? 1 : 0);
                // 需求三：物体未停止而完全越出运动区域 -> 整个演示立即结束
                if (tExit === null &&
                    (xA >= REGION_MAX || xA + bw <= REGION_MIN ||
                     xB >= REGION_MAX || xB + L <= REGION_MIN)) {
                    tExit = t;
                    if (xA >= REGION_MAX || xA + bw <= REGION_MIN) exitObjs.push('物块 A');
                    if (xB >= REGION_MAX || xB + L <= REGION_MIN) exitObjs.push('板块 B');
                }
            };
            rec();

            let guard = 0;
            while (guard++ < 50000 && t < T_CAP && tExit === null) {
                if (onPlate && locked) {
                    const v = vA;
                    const dec = (mu2 > 0 && Math.abs(v) > 1e-9) ? -Math.sign(v) * mu2 * g : 0;
                    if (Math.abs(dec) < 1e-12) {
                        if (!isFinite(horizon)) horizon = t + 6;
                        const tau = Math.min(dtMax, horizon - t);
                        if (tau <= 1e-12) break;
                        xB += v * tau;
                        xA += v * tau;
                        sRel = xA - xB;
                        if (!bMovedEver && Math.abs(xB) > 1e-9) bMovedEver = true;
                        t += tau;
                        rec();
                        if (t >= horizon) break;
                        continue;
                    }
                    const tauStop = Math.abs(v / dec);
                    const tau = Math.min(dtMax, tauStop);
                    const dx = v * tau + 0.5 * dec * tau * tau;
                    Q += mu2 * (mA + mB) * g * Math.abs(dx);
                    xB += dx;
                    xA += dx;
                    sRel = xA - xB;
                    if (!bMovedEver && Math.abs(xB) > 1e-9) bMovedEver = true;
                    vA += dec * tau;
                    vB += dec * tau;
                    t += tau;
                    rec();
                    if (tauStop <= tau + 1e-12) {
                        vA = 0; vB = 0;
                        tStop = t;
                        break;
                    }
                    continue;
                }

                if (onPlate) {
                    const vRel = vA - vB;
                    sigma = Math.sign(vRel) || sigma;
                    const aA = -sigma * mu1 * g;
                    let aB;
                    const Ftop = sigma * mu1 * mA * g;
                    if (Math.abs(vB) > 1e-9) {
                        aB = (Ftop - Math.sign(vB) * mu2 * (mA + mB) * g) / mB;
                    } else {
                        if (Math.abs(Ftop) <= mu2 * (mA + mB) * g + 1e-9) {
                            aB = 0;
                        } else {
                            aB = Math.sign(Ftop) * (mu1 * mA - mu2 * (mA + mB)) * g / mB;
                        }
                    }
                    const arel = aA - aB;
                    const vRel0 = vA - vB;

                    let tau = dtMax;
                    let eventType = null;

                    if (Math.abs(arel) > 1e-14) {
                        const tvr = -vRel0 / arel;
                        if (tvr > 1e-12 && tvr < tau) { tau = tvr; eventType = 'rel'; }
                    } else if (Math.abs(vRel0) < 1e-12) {
                        tau = 0; eventType = 'rel';
                    }

                    if (tau > 1e-12) {
                        const aRel = arel;
                        const roots = [Infinity, Infinity];
                        const A = 0.5 * aRel, B = vRel0, C1 = sRel - L, C2 = sRel + bw;
                        if (Math.abs(A) > 1e-14) {
                            const disc1 = B * B - 4 * A * C1;
                            if (disc1 >= 0) {
                                const sq = Math.sqrt(disc1);
                                const r1 = (-B + sq) / (2 * A);
                                const r2 = (-B - sq) / (2 * A);
                                if (r1 > 1e-12) roots[0] = r1;
                                if (r2 > 1e-12) roots[0] = Math.min(roots[0], r2);
                            }
                            const disc2 = B * B - 4 * A * C2;
                            if (disc2 >= 0) {
                                const sq = Math.sqrt(disc2);
                                const r1 = (-B + sq) / (2 * A);
                                const r2 = (-B - sq) / (2 * A);
                                if (r1 > 1e-12) roots[1] = r1;
                                if (r2 > 1e-12) roots[1] = Math.min(roots[1], r2);
                            }
                        } else if (Math.abs(B) > 1e-14) {
                            const tf = C1 / (-B);
                            const tb = C2 / (-B);
                            if (tf > 1e-12) roots[0] = tf;
                            if (tb > 1e-12) roots[1] = tb;
                        }
                        const tOffCand = Math.min(roots[0], roots[1]);
                        if (tOffCand < tau) { tau = tOffCand; eventType = 'off'; }

                        // 中心过缘事件（需求 17）：A 中心滑离板缘，触发视觉下落
                        if (!centerEvent) {
                            const C3 = sRel - (L - bw / 2);
                            const C4 = sRel + bw / 2;
                            const rootsC = [Infinity, Infinity];
                            if (Math.abs(A) > 1e-14) {
                                const disc3 = B * B - 4 * A * C3;
                                if (disc3 >= 0) {
                                    const sq = Math.sqrt(disc3);
                                    const r1 = (-B + sq) / (2 * A);
                                    const r2 = (-B - sq) / (2 * A);
                                    if (r1 > 1e-12) rootsC[0] = r1;
                                    if (r2 > 1e-12) rootsC[0] = Math.min(rootsC[0], r2);
                                }
                                const disc4 = B * B - 4 * A * C4;
                                if (disc4 >= 0) {
                                    const sq = Math.sqrt(disc4);
                                    const r1 = (-B + sq) / (2 * A);
                                    const r2 = (-B - sq) / (2 * A);
                                    if (r1 > 1e-12) rootsC[1] = r1;
                                    if (r2 > 1e-12) rootsC[1] = Math.min(rootsC[1], r2);
                                }
                            } else if (Math.abs(B) > 1e-14) {
                                const tcf = C3 / (-B);
                                const tcb = C4 / (-B);
                                if (tcf > 1e-12) rootsC[0] = tcf;
                                if (tcb > 1e-12) rootsC[1] = tcb;
                            }
                            const tCenterCand = Math.min(rootsC[0], rootsC[1]);
                            if (tCenterCand < tau) {
                                tau = tCenterCand;
                                eventType = 'center';
                                centerEdge = (rootsC[0] <= rootsC[1]) ? 'front' : 'back';
                            }
                        }
                    }

                    if (Math.abs(vB) > 1e-9 && Math.abs(aB) > 1e-14) {
                        const tvb = -vB / aB;
                        if (tvb > 1e-12 && tvb < tau) { tau = tvb; eventType = 'vbflip'; }
                    }

                    if (tau < 1e-12 && eventType === null) { t += dtMax; rec(); continue; }
                    if (tau < 1e-12) tau = 1e-12;

                    const dxB = vB * tau + 0.5 * aB * tau * tau;
                    const dxRel = vRel0 * tau + 0.5 * arel * tau * tau;
                    const dxA = vA * tau + 0.5 * aA * tau * tau;

                    Q += mu1 * mA * g * Math.abs(dxRel) + mu2 * (mA + mB) * g * Math.abs(dxB);

                    xA += dxA;
                    xB += dxB;
                    if (!bMovedEver && Math.abs(xB) > 1e-9) bMovedEver = true;
                    vA += aA * tau;
                    vB += aB * tau;
                    sRel += dxRel;
                    t += tau;

                    if (eventType === 'off') {
                        onPlate = false;
                        xA = xB + sRel;
                        if (sRel >= L - 1e-9) offEdge = 'front';
                        else offEdge = 'back';
                        tOff = t;
                        sRel1 = (sRel1 || 0) + Math.abs(sRel - sRelStart);
                    } else if (eventType === 'rel') {
                        if (Math.abs(vA - vB) > 1e-9) {
                            sigma = Math.sign(vA - vB) || sigma;
                        } else {
                            const vcm = vA;
                            if (Math.abs(vcm) < 1e-9) {
                                sRel1 = (sRel1 || 0) + Math.abs(sRel - sRelStart);
                                vA = 0; vB = 0; tStop = t;
                                rec(); break;
                            }
                            if (t1 === null) { t1 = t; vCommon = vcm; }
                            sRel1 = (sRel1 || 0) + Math.abs(sRel - sRelStart);
                            if (mu1 + 1e-12 >= mu2) {
                                locked = true;
                            } else {
                                slipAfter = true;
                                sigma = Math.sign(vcm) || 1;
                            }
                            sRelStart = sRel;
                        }
                    } else if (eventType === 'vbflip') {
                        vB = 0;
                    } else if (eventType === 'center') {
                        // 中心过缘事件（需求 17）：事件驱动已精确求解，t 即精确时刻
                        centerEvent = true;
                        tCenter = t;
                    }
                    rec();
                    continue;
                }

                const decA = (mu2 > 0 && Math.abs(vA) > 1e-9) ? -Math.sign(vA) * mu2 * g : 0;
                const decB = (mu2 > 0 && Math.abs(vB) > 1e-9) ? -Math.sign(vB) * mu2 * g : 0;
                const tauA = Math.abs(decA) > 1e-14 ? Math.abs(vA / decA) : Infinity;
                const tauB = Math.abs(decB) > 1e-14 ? Math.abs(vB / decB) : Infinity;
                let tau = Math.min(dtMax, tauA, tauB);
                if (tau < 1e-12) tau = 1e-12;

                const dxAv = vA * tau + 0.5 * decA * tau * tau;
                const dxBv = vB * tau + 0.5 * decB * tau * tau;
                Q += mu2 * mA * g * Math.abs(dxAv) + mu2 * mB * g * Math.abs(dxBv);

        xA += dxAv;
        xB += dxBv;
        if (!bMovedEver && Math.abs(xB) > 1e-9) bMovedEver = true;
        vA += decA * tau;
                vB += decB * tau;
                t += tau;

                if (Math.abs(vA) < 1e-9 && Math.abs(vB) < 1e-9) {
                    vA = 0; vB = 0; tStop = t;
                    rec(); break;
                }
                if (Math.abs(vA) < 1e-9) vA = 0;
                if (Math.abs(vB) < 1e-9) vB = 0;

                if (mu2 === 0 && !isFinite(horizon)) horizon = (tOff || t1 || 0) + 6;
                rec();
                if (isFinite(horizon) && t >= horizon) break;
            }

            if (t1 === null && !onPlate && sRel1 === null) {
                sRel1 = L;
            }

            let tEnd;
            if (tExit !== null) {
                tEnd = tExit;
            } else if (tStop !== null) {
                tEnd = tStop + 1.0;
            } else if (isFinite(horizon)) {
                tEnd = horizon;
            } else {
                tEnd = t;
            }
            tEnd = Math.min(tEnd, T_CAP);

            return {
                T, VA, VB, XA, XB, ON,
                t1, vCommon, sRel1: sRel1 || 0,
                willSlideOff: tOff !== null, tOff, offEdge, tCenter,
                slipAfter, tStop, tEnd, heat: Q,
                bMovedEver, mu2, tExit, exitObjs,
            };
        }

        // ========== 状态 ==========
        let state = 'idle';
        let simT  = 0;
        let lastTs = null;
        let timeScale = 1;
        let animId = null;
        let sim = null;
        let playIdx = 0;
        let lastDraw = null;
        let slideOffTriggered = false;

        // ========== 绘制：受力分析箭头 ==========
        const ARROW_K = 2.4;
        const ARROW_MIN = 10;
        const ARROW_MAX = 60;

        // 下落过渡进度（需求 三.4 / 18）：tCenter 后 0.15s 内 0→1（二次缓动）
        function dropFraction(t) {
            if (!sim || sim.tCenter === null || t < sim.tCenter) return 0;
            const f = Math.min(1, (t - sim.tCenter) / 0.15);
            return f * f;
        }

        function arrowLen(N) {
            const len = Math.abs(N) * ARROW_K;
            return Math.max(ARROW_MIN, Math.min(ARROW_MAX, len));
        }

        function drawArrow(cx, cy, dir, len, color, label) {
            const backX = cx - dir * (len / 2);
            const tipX = cx + dir * (len / 2);
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(backX, cy);
            ctx.lineTo(tipX, cy);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(tipX, cy);
            ctx.lineTo(tipX - dir * 8, cy - 5);
            ctx.lineTo(tipX - dir * 8, cy + 5);
            ctx.closePath();
            ctx.fill();
            ctx.font = 'bold 12px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText(label, tipX - dir * 16, cy + 4);
        }

        function drawForces(t, drawA, drawB, s) {
            if (!sim || sim.ON.length < 2) return;
            const mu1 = P.mu, mu2 = P.mu2;
            const groundY = view.height - PAD_BOTTOM;
            const blockH = BLOCK_W_M * s;
            const SX = x => PAD_X + (x - REGION_MIN) * s;

            const aCX = drawA.x + BLOCK_W_M / 2;
            const bCX = drawB.x + P.L / 2;
            const aScreenX = SX(aCX);
            const bScreenX = SX(bCX);

            if (drawA.onPlate) {
                const vRel = drawA.v - drawB.v;
                const isSliding = Math.abs(vRel) > 1e-6;
                const sig = Math.sign(vRel) || 1;

                // 下落过渡期（需求 18）：f₁/f₁′ 箭头透明度随下落进度渐隐
                const dropFrac = dropFraction(t);
                const fAlpha = 1 - dropFrac * 0.85;

                if (isSliding) {
                    const fMag = mu1 * P.mA * g;
                    if (fMag > 0.1) {
                        const fDir = -sig;
                        const aMidY = groundY - PLATE_H - blockH / 2;
                        drawArrow(aScreenX, aMidY, fDir, arrowLen(fMag), `rgba(255,221,87,${fAlpha})`, 'f₁');
                        const bTopY = groundY - PLATE_H - 6;
                        drawArrow(aScreenX, bTopY, -fDir, arrowLen(fMag), `rgba(255,221,87,${fAlpha})`, "f₁'");
                    }
                } else if (mu2 > 0 && Math.abs(drawA.v) > 1e-6) {
                    const fStat = P.mA * mu2 * g;
                    if (fStat > 0.1) {
                        const fDir = Math.sign(drawA.v) > 0 ? -1 : 1;
                        const aMidY = groundY - PLATE_H - blockH / 2;
                        drawArrow(aScreenX, aMidY, fDir, arrowLen(fStat), `rgba(255,221,87,${fAlpha})`, 'f₁');
                        const bTopY = groundY - PLATE_H - 6;
                        drawArrow(aScreenX, bTopY, -fDir, arrowLen(fStat), `rgba(255,221,87,${fAlpha})`, "f₁'");
                    }
                }

                if (Math.abs(drawB.v) > 1e-6) {
                    const fGnd = mu2 * (P.mA + P.mB) * g;
                    const fDir = Math.sign(drawB.v) > 0 ? -1 : 1;
                    if (fGnd > 0.1) {
                        const fGndY = groundY + 12;
                        drawArrow(bScreenX, fGndY, fDir, arrowLen(fGnd), '#ff6644', 'f₂');
                    }
                } else if (mu2 > 0 && Math.abs(drawA.v) > 1e-6) {
                    const driveF = mu1 * P.mA * g;
                    if (driveF <= mu2 * (P.mA + P.mB) * g + 1e-9 && driveF > 0.1) {
                        const fDir = -sig;
                        const fGndY = groundY + 12;
                        drawArrow(bScreenX, fGndY, fDir, arrowLen(driveF), '#ff6644', 'f₂');
                    }
                }
            } else {
                // 需求 18：滑出后 f₂ 箭头随物块视觉位置（含下落过渡）同步下降、透明度渐入
                const dropFrac = dropFraction(t);
                if (mu2 > 0 && Math.abs(drawA.v) > 1e-6) {
                    const fA = mu2 * P.mA * g;
                    const fDir = Math.sign(drawA.v) > 0 ? -1 : 1;
                    const aBotNow = groundY - PLATE_H + PLATE_H * dropFrac;
                    const aMidY = aBotNow - blockH / 2;
                    const alpha = (0.15 + 0.85 * dropFrac).toFixed(2);
                    drawArrow(aScreenX, aMidY, fDir, arrowLen(fA), `rgba(255,102,68,${alpha})`, 'f₂');
                }
                if (mu2 > 0 && Math.abs(drawB.v) > 1e-6) {
                    const fB = mu2 * P.mB * g;
                    const fDir = Math.sign(drawB.v) > 0 ? -1 : 1;
                    const bMidY = groundY - PLATE_H / 2;
                    drawArrow(bScreenX, bMidY, fDir, arrowLen(fB), '#ff6644', 'f₂');
                }
            }
        }

        // ========== 绘制：运动场景 ==========
        function drawScene(t, drawA, drawB) {
            ctx.clearRect(0, 0, view.width, view.height);

            const s = viewScale();
            const groundY = view.height - PAD_BOTTOM;
            const SX = x => PAD_X + (x - REGION_MIN) * s;

            // 水平网格
            ctx.strokeStyle = '#16222e';
            ctx.lineWidth = 1;
            for (let gy = groundY - 44; gy > 24; gy -= 44) {
                ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(view.width, gy); ctx.stroke();
            }
            // 竖直网格（世界坐标，覆盖整个运动区域，步长随比例尺自适应）
            const gridStep = s >= 40 ? 1 : (s >= 15 ? 2 : 5);
            for (let m = Math.ceil(REGION_MIN / gridStep) * gridStep; m <= REGION_MAX; m += gridStep) {
                const x = SX(m);
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, groundY); ctx.stroke();
            }

            // 运动区域边界（需求三）：左右边界醒目虚线
            ctx.strokeStyle = 'rgba(255,102,68,0.8)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 6]);
            for (const bx of [SX(REGION_MIN), SX(REGION_MAX)]) {
                ctx.beginPath(); ctx.moveTo(bx, 14); ctx.lineTo(bx, groundY); ctx.stroke();
            }
            ctx.setLineDash([]);

            // 正方向标注（需求二.1）
            ctx.fillStyle = '#8899aa';
            ctx.font = '11px system-ui';
            ctx.textAlign = 'right';
            ctx.fillText('正方向 →', SX(REGION_MAX) - 6, 24);
            ctx.textAlign = 'left';
            ctx.fillText('运动区域', SX(REGION_MIN) + 6, 24);

            // 地面
            ctx.strokeStyle = '#3a4a5a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(view.width, groundY);
            ctx.stroke();

            // 地面距离标注（世界坐标，覆盖整个运动区域含负半轴）
            const labelStep = s >= 90 ? 2 : (s >= 40 ? 5 : 10);
            ctx.fillStyle = '#556677';
            ctx.font = '11px system-ui';
            ctx.textAlign = 'center';
            for (let m = Math.ceil(REGION_MIN / labelStep) * labelStep; m <= REGION_MAX; m += labelStep) {
                ctx.fillText(m + 'm', SX(m), groundY + 24);
            }

            // 板块 B
            const bLeft  = SX(drawB.x);
            const bRight = SX(drawB.x + P.L);
            const bTop   = groundY - PLATE_H;
            const bBot   = groundY;

            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(bLeft + 4, bBot + 3, bRight - bLeft, 7);

            const bg = ctx.createLinearGradient(bLeft, bTop, bLeft, bBot);
            bg.addColorStop(0, '#dd8833');
            bg.addColorStop(0.6, '#bb6600');
            bg.addColorStop(1, '#7a3d00');
            ctx.fillStyle = bg;
            ctx.fillRect(bLeft, bTop, bRight - bLeft, bBot - bTop);

            ctx.strokeStyle = '#ffaa44';
            ctx.lineWidth = 2;
            ctx.strokeRect(bLeft, bTop, bRight - bLeft, bBot - bTop);

            ctx.strokeStyle = 'rgba(255,255,255,0.14)';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 3; i++) {
                const ly = bTop + (bBot - bTop) * i / 4;
                ctx.beginPath();
                ctx.moveTo(bLeft + 5, ly);
                ctx.lineTo(bRight - 5, ly);
                ctx.stroke();
            }

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 11px system-ui';
            ctx.textAlign = 'center';
            // 需求 21：窄画布（移动端）板标签自动精简，避免超出板宽
            let bLabel = `板块 B · vᵦ = ${drawB.v.toFixed(1)} m/s · L = ${P.L.toFixed(1)} m`;
            if (ctx.measureText(bLabel).width > bRight - bLeft - 6) {
                bLabel = `B · ${drawB.v.toFixed(1)} m/s`;
            }
            ctx.fillText(bLabel, (bLeft + bRight) / 2, bTop + 16);

            // 物块 A
            // 物块 A：固定正方形（需求一），宽 = 高 = BLOCK_W_M × scale
            const blockW = BLOCK_W_M * s;
            const blockH = blockW;

            // 下落过渡（需求 三.4）：A 中心滑离板缘（tCenter）后 0.15s 内
            // 从板面平滑降至地面；物理滑出事件（相对滑移 = 板长）不受影响
            const dropFrac = dropFraction(t);
            const aBot = bTop + PLATE_H * dropFrac;
            const aTopY = aBot - blockH;

            // 需求 21：块宽不足以容纳文字时（移动端窄块），名称/速度上移到块上方
            ctx.font = 'bold 11px system-ui';
            const nameTooWide = ctx.measureText('物块 A').width > blockW;

            if (drawA.onPlate) {
                const aLeft = SX(drawA.x);

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(aLeft + 3, aBot + 3, blockW, 5);

                const ag = ctx.createLinearGradient(aLeft, aTopY, aLeft, aBot);
                ag.addColorStop(0, '#4db8ff');
                ag.addColorStop(1, '#1170cc');
                ctx.fillStyle = ag;
                ctx.fillRect(aLeft, aTopY, blockW, aBot - aTopY);

                ctx.strokeStyle = '#7dd0ff';
                ctx.lineWidth = 2;
                ctx.strokeRect(aLeft, aTopY, blockW, aBot - aTopY);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px system-ui';
                ctx.textAlign = 'center';
                if (nameTooWide) {
                    ctx.fillText('物块 A', aLeft + blockW / 2, aTopY - 16);
                } else {
                    ctx.fillText('物块 A', aLeft + blockW / 2, aTopY + 14);
                }
                ctx.fillStyle = '#cceaff';
                ctx.font = '10px system-ui';
                const spdText = `${drawA.v.toFixed(1)} m/s`;
                if (nameTooWide || ctx.measureText(spdText).width > blockW) {
                    ctx.fillText(spdText, aLeft + blockW / 2, aTopY - 5);
                } else {
                    ctx.fillText(spdText, aLeft + blockW / 2, aTopY + 27);
                }
            } else {
                const ax = Math.max(4, Math.min(SX(drawA.x), view.width - blockW - 4));

                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(ax + 3, aBot + 3, blockW, 5);

                const ag = ctx.createLinearGradient(ax, aTopY, ax, aBot);
                ag.addColorStop(0, '#4db8ff');
                ag.addColorStop(1, '#1170cc');
                ctx.fillStyle = ag;
                ctx.fillRect(ax, aTopY, blockW, blockH);

                ctx.strokeStyle = '#7dd0ff';
                ctx.lineWidth = 2;
                ctx.strokeRect(ax, aTopY, blockW, blockH);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px system-ui';
                ctx.textAlign = 'center';
                // 需求 21：窄块时文字上移（滑出后分支，名称为短标签 'A'）
                ctx.fillText('A', ax + blockW / 2, nameTooWide ? aTopY - 16 : aTopY + 14);
                ctx.fillStyle = '#cceaff';
                ctx.font = '10px system-ui';
                const spdText2 = `${drawA.v.toFixed(1)} m/s`;
                if (nameTooWide || ctx.measureText(spdText2).width > blockW) {
                    ctx.fillText(spdText2, ax + blockW / 2, aTopY - 5);
                } else {
                    ctx.fillText(spdText2, ax + blockW / 2, aTopY + 27);
                }
            }

            // 摩擦力
            drawForces(t, drawA, drawB, s);
        }

        // ========== 绘制：v-t 图 ==========
        function drawGraph() {
            const w = gview.width, h = gview.height;
            gctx.clearRect(0, 0, w, h);

            const padL = 50, padR = 18, padT = 16, padB = 32;
            const plotW = w - padL - padR;
            const plotH = h - padT - padB;

            gctx.strokeStyle = '#7b8ea3';
            gctx.lineWidth = 2;
            gctx.beginPath();
            gctx.moveTo(padL, padT);
            gctx.lineTo(padL, padT + plotH);
            gctx.lineTo(padL + plotW, padT + plotH);
            gctx.stroke();

            if (!sim || playIdx < 1) {
                gctx.fillStyle = '#44586c';
                gctx.font = '12px system-ui';
                gctx.textAlign = 'center';
                gctx.fillText('开始后将显示 v-t 图', w / 2, h / 2);
                return;
            }

            const tMax = Math.max(6, sim.tEnd, sim.T[sim.T.length - 1] || 0);
            let vHi = -Infinity, vLo = Infinity;
            for (let i = 0; i < sim.VA.length; i++) {
                vHi = Math.max(vHi, sim.VA[i], sim.VB[i]);
                vLo = Math.min(vLo, sim.VA[i], sim.VB[i]);
            }
            vHi = Math.max(vHi, P.v0A, P.v0B, 1) * 1.2;
            vLo = Math.min(vLo, 0) * 1.2;
            if (vLo >= 0) vLo = 0;

            const TX = t => padL + (t / tMax) * plotW;
            const VY = v => padT + plotH - ((v - vLo) / (vHi - vLo)) * plotH;

            // 网格
            gctx.strokeStyle = '#1f2d3d';
            gctx.lineWidth = 1;
            const tStep = tMax <= 6 ? 1 : 2;
            for (let t = 0; t <= tMax; t += tStep) {
                const x = TX(t);
                gctx.beginPath(); gctx.moveTo(x, padT); gctx.lineTo(x, padT + plotH); gctx.stroke();
                gctx.fillStyle = '#8899aa';
                gctx.font = '10px system-ui';
                gctx.textAlign = 'center';
                gctx.fillText(t.toFixed(0) + 's', x, padT + plotH + 14);
            }
            const vRange = vHi - vLo;
            const rawVStep = vRange / 5;
            const mag = Math.pow(10, Math.floor(Math.log10(rawVStep)));
            let vStep = mag;
            if (rawVStep / mag > 5) vStep = mag * 10;
            else if (rawVStep / mag > 2) vStep = mag * 5;
            else if (rawVStep / mag > 1) vStep = mag * 2;
            const vStart = Math.ceil(vLo / vStep) * vStep;
            for (let v = vStart; v <= vHi; v += vStep) {
                const y = VY(v);
                gctx.beginPath(); gctx.moveTo(padL, y); gctx.lineTo(padL + plotW, y); gctx.stroke();
                gctx.fillStyle = '#8899aa';
                gctx.font = '10px system-ui';
                gctx.textAlign = 'right';
                gctx.fillText(v.toFixed(0), padL - 5, y + 3);
            }
            // 零线
            if (vLo < 0 && vHi > 0) {
                const y0 = VY(0);
                gctx.strokeStyle = 'rgba(255,255,255,0.25)';
                gctx.lineWidth = 1;
                gctx.beginPath(); gctx.moveTo(padL, y0); gctx.lineTo(padL + plotW, y0); gctx.stroke();
            }

            // 事件标注
            if (sim.t1 !== null && sim.t1 <= tMax) {
                gctx.strokeStyle = 'rgba(255,255,255,0.18)';
                gctx.setLineDash([4, 4]);
                gctx.beginPath();
                gctx.moveTo(TX(sim.t1), padT);
                gctx.lineTo(TX(sim.t1), padT + plotH);
                gctx.stroke();
                gctx.setLineDash([]);
                gctx.fillStyle = sim.slipAfter ? '#ffdd57' : '#ffaa22';
                gctx.font = '10px system-ui';
                gctx.textAlign = 'center';
                gctx.fillText(
                    sim.slipAfter ? '共速后滑' : '共速 ' + sim.vCommon.toFixed(1),
                    TX(sim.t1), padT + 10
                );
            }
            if (sim.willSlideOff && sim.tOff !== null && sim.tOff <= tMax) {
                gctx.strokeStyle = 'rgba(255,102,68,0.35)';
                gctx.setLineDash([4, 4]);
                gctx.beginPath();
                gctx.moveTo(TX(sim.tOff), padT);
                gctx.lineTo(TX(sim.tOff), padT + plotH);
                gctx.stroke();
                gctx.setLineDash([]);
                gctx.fillStyle = '#ff8866';
                gctx.font = '10px system-ui';
                gctx.textAlign = 'center';
                gctx.fillText('滑出', TX(sim.tOff), padT + 10);
            }

            // 曲线 A
            gctx.strokeStyle = '#3399ff';
            gctx.lineWidth = 2;
            gctx.lineJoin = 'round';
            gctx.beginPath();
            gctx.moveTo(TX(sim.T[0]), VY(sim.VA[0]));
            const endIdx = Math.min(playIdx + 1, sim.VA.length);
            for (let i = 1; i < endIdx; i++) {
                gctx.lineTo(TX(sim.T[i]), VY(sim.VA[i]));
            }
            gctx.stroke();

            // 曲线 B
            gctx.strokeStyle = '#ff9933';
            gctx.lineWidth = 2;
            gctx.beginPath();
            gctx.moveTo(TX(sim.T[0]), VY(sim.VB[0]));
            for (let i = 1; i < endIdx; i++) {
                gctx.lineTo(TX(sim.T[i]), VY(sim.VB[i]));
            }
            gctx.stroke();

            // 播放头
            const ci = Math.min(playIdx, sim.T.length - 1);
            const pxNow = TX(sim.T[ci]);
            gctx.strokeStyle = 'rgba(51, 136, 221, 0.4)';
            gctx.lineWidth = 1;
            gctx.beginPath();
            gctx.moveTo(pxNow, padT);
            gctx.lineTo(pxNow, padT + plotH);
            gctx.stroke();
            gctx.fillStyle = '#3399ff';
            gctx.beginPath(); gctx.arc(pxNow, VY(sim.VA[ci]), 3.5, 0, Math.PI * 2); gctx.fill();
            gctx.fillStyle = '#ff9933';
            gctx.beginPath(); gctx.arc(pxNow, VY(sim.VB[ci]), 3.5, 0, Math.PI * 2); gctx.fill();

            // 轴标签
            gctx.fillStyle = '#8899aa';
            gctx.font = '11px system-ui';
            gctx.textAlign = 'center';
            gctx.fillText('t (s)', padL + plotW / 2, h - 4);
            gctx.save();
            gctx.translate(9, padT + plotH / 2);
            gctx.rotate(-Math.PI / 2);
            gctx.fillText('v (m/s)', 0, 0);
            gctx.restore();

            // 图例
            gctx.textAlign = 'left';
            gctx.fillStyle = '#3399ff';
            gctx.fillRect(padL + 6, padT + 22, 14, 3);
            gctx.fillStyle = '#8899aa';
            gctx.font = '10px system-ui';
            gctx.fillText('vₐ', padL + 24, padT + 28);
            gctx.fillStyle = '#ff9933';
            gctx.fillRect(padL + 52, padT + 22, 14, 3);
            gctx.fillStyle = '#8899aa';
            gctx.fillText('vᵦ', padL + 70, padT + 28);
        }

        // ========== 绘制：s-t 图 ==========
        function drawST() {
            const w = sview.width, h = sview.height;
            stctx.clearRect(0, 0, w, h);

            const padL = 50, padR = 18, padT = 16, padB = 32;
            const plotW = w - padL - padR;
            const plotH = h - padT - padB;

            stctx.strokeStyle = '#7b8ea3';
            stctx.lineWidth = 2;
            stctx.beginPath();
            stctx.moveTo(padL, padT);
            stctx.lineTo(padL, padT + plotH);
            stctx.lineTo(padL + plotW, padT + plotH);
            stctx.stroke();

            if (!sim || playIdx < 1) {
                stctx.fillStyle = '#44586c';
                stctx.font = '12px system-ui';
                stctx.textAlign = 'center';
                stctx.fillText('开始后将显示 s-t 图', w / 2, h / 2);
                return;
            }

            const tMax = Math.max(6, sim.tEnd, sim.T[sim.T.length - 1] || 0);
            const s0A = sim.XA[0], s0B = sim.XB[0];
            let sHi = -Infinity, sLo = Infinity;
            for (let i = 0; i < sim.XA.length; i++) {
                sHi = Math.max(sHi, sim.XA[i] - s0A, sim.XB[i] - s0B);
                sLo = Math.min(sLo, sim.XA[i] - s0A, sim.XB[i] - s0B);
            }
            sHi = Math.max(sHi, 0.5) * 1.15;
            sLo = Math.min(sLo, 0) * 1.15;
            if (sHi <= 0) sHi = 1;

            const TX = t => padL + (t / tMax) * plotW;
            const SY = s => padT + plotH - ((s - sLo) / (sHi - sLo)) * plotH;

            // 时间网格（与 v-t 图一致）
            stctx.strokeStyle = '#1f2d3d';
            stctx.lineWidth = 1;
            const tStep = tMax <= 6 ? 1 : 2;
            for (let t = 0; t <= tMax; t += tStep) {
                const x = TX(t);
                stctx.beginPath(); stctx.moveTo(x, padT); stctx.lineTo(x, padT + plotH); stctx.stroke();
                stctx.fillStyle = '#8899aa';
                stctx.font = '10px system-ui';
                stctx.textAlign = 'center';
                stctx.fillText(t.toFixed(0) + 's', x, padT + plotH + 14);
            }
            // 位移网格
            const sRange = sHi - sLo;
            const rawS = sRange / 4;
            const magS = Math.pow(10, Math.floor(Math.log10(rawS)));
            let sStep = magS;
            if (rawS / magS > 5) sStep = magS * 10;
            else if (rawS / magS > 2) sStep = magS * 5;
            else if (rawS / magS > 1) sStep = magS * 2;
            const sDec = sStep < 1 ? 1 : 0;
            const sStart = Math.ceil(sLo / sStep) * sStep;
            for (let s = sStart; s <= sHi; s += sStep) {
                const y = SY(s);
                stctx.beginPath(); stctx.moveTo(padL, y); stctx.lineTo(padL + plotW, y); stctx.stroke();
                stctx.fillStyle = '#8899aa';
                stctx.font = '10px system-ui';
                stctx.textAlign = 'right';
                stctx.fillText(s.toFixed(sDec), padL - 5, y + 3);
            }
            // 零线
            if (sLo < 0 && sHi > 0) {
                const y0 = SY(0);
                stctx.strokeStyle = 'rgba(255,255,255,0.25)';
                stctx.lineWidth = 1;
                stctx.beginPath(); stctx.moveTo(padL, y0); stctx.lineTo(padL + plotW, y0); stctx.stroke();
            }

            // 事件标注
            if (sim.t1 !== null && sim.t1 <= tMax) {
                stctx.strokeStyle = 'rgba(255,255,255,0.18)';
                stctx.setLineDash([4, 4]);
                stctx.beginPath();
                stctx.moveTo(TX(sim.t1), padT);
                stctx.lineTo(TX(sim.t1), padT + plotH);
                stctx.stroke();
                stctx.setLineDash([]);
                stctx.fillStyle = sim.slipAfter ? '#ffdd57' : '#ffaa22';
                stctx.font = '10px system-ui';
                stctx.textAlign = 'center';
                stctx.fillText(sim.slipAfter ? '共速后滑' : '共速', TX(sim.t1), padT + 10);
            }
            if (sim.willSlideOff && sim.tOff !== null && sim.tOff <= tMax) {
                stctx.strokeStyle = 'rgba(255,102,68,0.35)';
                stctx.setLineDash([4, 4]);
                stctx.beginPath();
                stctx.moveTo(TX(sim.tOff), padT);
                stctx.lineTo(TX(sim.tOff), padT + plotH);
                stctx.stroke();
                stctx.setLineDash([]);
                stctx.fillStyle = '#ff8866';
                stctx.font = '10px system-ui';
                stctx.textAlign = 'center';
                stctx.fillText('滑出', TX(sim.tOff), padT + 10);
            }

            // 曲线 A（位移 = XA - XA[0]）
            stctx.strokeStyle = '#3399ff';
            stctx.lineWidth = 2;
            stctx.lineJoin = 'round';
            stctx.beginPath();
            stctx.moveTo(TX(sim.T[0]), SY(sim.XA[0] - s0A));
            const endIdx = Math.min(playIdx + 1, sim.XA.length);
            for (let i = 1; i < endIdx; i++) {
                stctx.lineTo(TX(sim.T[i]), SY(sim.XA[i] - s0A));
            }
            stctx.stroke();

            // 曲线 B（位移 = XB - XB[0]）
            stctx.strokeStyle = '#ff9933';
            stctx.lineWidth = 2;
            stctx.beginPath();
            stctx.moveTo(TX(sim.T[0]), SY(sim.XB[0] - s0B));
            for (let i = 1; i < endIdx; i++) {
                stctx.lineTo(TX(sim.T[i]), SY(sim.XB[i] - s0B));
            }
            stctx.stroke();

            // 末端位移标注（需求 20）
            if (endIdx > 1) {
                const lastEI = endIdx - 1;
                const sAEnd = sim.XA[lastEI] - s0A;
                const sBEnd = sim.XB[lastEI] - s0B;
                const pxEndA = TX(sim.T[lastEI]);
                const pxEndB = TX(sim.T[lastEI]);

                stctx.font = '9px system-ui';
                stctx.textAlign = 'left';
                stctx.fillStyle = '#3399ff';
                stctx.fillText(sAEnd.toFixed(1) + 'm', pxEndA + 5, SY(sAEnd) + 3);
                stctx.fillStyle = '#ff9933';
                stctx.fillText(sBEnd.toFixed(1) + 'm', pxEndB + 5, SY(sBEnd) + 3);
            }

            // 播放头
            const ci = Math.min(playIdx, sim.T.length - 1);
            const pxNow = TX(sim.T[ci]);
            stctx.strokeStyle = 'rgba(51, 136, 221, 0.4)';
            stctx.lineWidth = 1;
            stctx.beginPath();
            stctx.moveTo(pxNow, padT);
            stctx.lineTo(pxNow, padT + plotH);
            stctx.stroke();
            stctx.fillStyle = '#3399ff';
            stctx.beginPath(); stctx.arc(pxNow, SY(sim.XA[ci] - s0A), 3.5, 0, Math.PI * 2); stctx.fill();
            stctx.fillStyle = '#ff9933';
            stctx.beginPath(); stctx.arc(pxNow, SY(sim.XB[ci] - s0B), 3.5, 0, Math.PI * 2); stctx.fill();

            // 轴标签
            stctx.fillStyle = '#8899aa';
            stctx.font = '11px system-ui';
            stctx.textAlign = 'center';
            stctx.fillText('t (s)', padL + plotW / 2, h - 4);
            stctx.save();
            stctx.translate(9, padT + plotH / 2);
            stctx.rotate(-Math.PI / 2);
            stctx.fillText('s (m)', 0, 0);
            stctx.restore();

            // 图例
            stctx.textAlign = 'left';
            stctx.fillStyle = '#3399ff';
            stctx.fillRect(padL + 6, padT + 22, 14, 3);
            stctx.fillStyle = '#8899aa';
            stctx.font = '10px system-ui';
            stctx.fillText('sₐ', padL + 24, padT + 28);
            stctx.fillStyle = '#ff9933';
            stctx.fillRect(padL + 52, padT + 22, 14, 3);
            stctx.fillStyle = '#8899aa';
            stctx.fillText('sᵦ', padL + 70, padT + 28);
        }

        // ========== 双图同步绘制 ==========
        function drawCharts() {
            drawGraph();
            drawST();
        }

        // ========== 动画帧 ==========
        function frame(ts) {
            if (state !== 'running') return;
            if (lastTs === null) lastTs = ts;
            const rawDt = (ts - lastTs) / 1000;
            lastTs = ts;
            const dt = Math.min(rawDt, 0.05) * timeScale;
            simT += dt;

            while (playIdx < sim.T.length - 1 && sim.T[playIdx + 1] <= simT) {
                playIdx++;
            }

            if (simT >= sim.tEnd) {
                endSim();
                return;
            }

            const i0 = playIdx;
            const i1 = Math.min(i0 + 1, sim.T.length - 1);
            const tau = sim.T[i1] - sim.T[i0];
            const f = tau > 1e-12 ? (simT - sim.T[i0]) / tau : 0;
            const vA = sim.VA[i0] + (sim.VA[i1] - sim.VA[i0]) * f;
            const vB = sim.VB[i0] + (sim.VB[i1] - sim.VB[i0]) * f;
            const xA = sim.XA[i0] + (sim.XA[i1] - sim.XA[i0]) * f;
            const xB = sim.XB[i0] + (sim.XB[i1] - sim.XB[i0]) * f;
            const onPlate = sim.ON[i0] === 1;

            const drawB = { x: xB, v: vB };
            const drawA = { x: xA, v: vA, onPlate: onPlate };
            lastDraw = { drawA, drawB };

            if (!onPlate && !slideOffTriggered) {
                slideOffTriggered = true;
                elStatus.textContent = '⚠ 物块 A 已滑出板块 B，两者以各自速度继续运动...';
            }

            drawScene(simT, drawA, drawB);

            elVA.textContent  = vA.toFixed(2) + ' m/s';
            elVB.textContent  = vB.toFixed(2) + ' m/s';
            elVR.textContent  = Math.abs(vA - vB).toFixed(2) + ' m/s';

            if (!onPlate) {
                elState.textContent = 'A 已滑出（各自运动）';
                elState.style.color = '#ff6644';
            } else if (Math.abs(vA - vB) < 1e-6) {
                if (Math.abs(vA) < 1e-6) {
                    elState.textContent = '共同停止';
                    elState.style.color = '#aab';
                } else {
                    elState.textContent = '共速一起运动';
                    elState.style.color = '#ffaa22';
                }
            } else {
                if (Math.abs(vB) < 1e-6 && Math.abs(vA) > 1e-6) {
                    elState.textContent = 'A 在静止板上滑动';
                    elState.style.color = '#3399ff';
                } else {
                    elState.textContent = 'A 在 B 上滑动';
                    elState.style.color = '#3399ff';
                }
            }

            drawCharts();
            animId = requestAnimationFrame(frame);
        }

        function endSim() {
            state = 'ended';
            if (animId) { cancelAnimationFrame(animId); animId = null; }

            const lastI = sim.T.length - 1;
            const drawB = { x: sim.XB[lastI], v: sim.VB[lastI] };
            const drawA = { x: sim.XA[lastI], v: sim.VA[lastI], onPlate: sim.ON[lastI] === 1 };
            lastDraw = { drawA, drawB };
            playIdx = lastI;

            drawScene(sim.T[lastI], drawA, drawB);
            drawCharts();

            elState.textContent = '结束';
            elState.style.color = '#aab';
            btnStart.disabled = true;
            btnReset.disabled = false;

            elV0A.disabled = false;
            elV0B.disabled = false;
            elMA.disabled = false;
            elMB.disabled = false;
            elMu.disabled = false;
            elMu2.disabled = false;
            elL.disabled = false;
            elTs.disabled = false;

            let msg;
            if (sim.tExit !== null) {
                msg = `${sim.exitObjs.join('、')} 未停止即越出运动区域（−10 m ～ +40 m），演示结束。`;
            } else if (sim.willSlideOff) {
                const edge = sim.offEdge === 'back' ? '后' : '前';
                msg = sim.mu2 > 0
                    ? `物块 A 于 t = ${sim.tOff.toFixed(2)} s 从板块${edge}缘滑出，随后 A、B 均在地面摩擦下减速停止。`
                    : `物块 A 于 t = ${sim.tOff.toFixed(2)} s 从板块${edge}缘滑出，A、B 分别以 ${sim.VA[Math.min(playIdx, lastI)].toFixed(2)} m/s 与 ${sim.VB[Math.min(playIdx, lastI)].toFixed(2)} m/s 匀速运动。`;
            } else if (!sim.bMovedEver) {
                msg = `地面摩擦足够大（μ₁m_A ≤ μ₂(m_A+m_B)），B 保持静止；物块 A 在板上滑行 ${sim.sRel1.toFixed(2)} m 后停下。`;
            } else if (sim.slipAfter) {
                msg = `两者于 t = ${(sim.t1 ?? 0).toFixed(2)} s 达到共同速度 ${(sim.vCommon ?? 0).toFixed(2)} m/s，但 μ₁ < μ₂，静摩擦不足以锁死，随后再次相对滑动。`;
            } else if (sim.mu2 > 0) {
                msg = `两者于 t = ${(sim.t1 ?? 0).toFixed(2)} s 达到共同速度 ${(sim.vCommon ?? 0).toFixed(2)} m/s（μ₁≥μ₂，可锁死），随后一起匀减速停止。`;
            } else {
                msg = `物块 A 与板块 B 达到共同速度 ${(sim.vCommon ?? 0).toFixed(2)} m/s，一起匀速运动。`;
            }
            elStatus.textContent = msg;
        }

        // ========== 自适应尺寸 ==========
        function setupCanvas(canvasEl, viewObj, baseW, baseH) {
            const cssWidth = canvasEl.clientWidth || baseW;
            const cssHeight = cssWidth * baseH / baseW;
            const devicePixelRatio = window.devicePixelRatio || 1;
            canvasEl.width = Math.round(cssWidth * devicePixelRatio);
            canvasEl.height = Math.round(cssHeight * devicePixelRatio);
            canvasEl.getContext('2d').setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
            viewObj.width = cssWidth;
            viewObj.height = cssHeight;
        }

        function resizeAll() {
            setupCanvas(canvas, view, BASE_WIDTH, BASE_HEIGHT);
            setupCanvas(graphCanvas, gview, GRAPH_WIDTH, GRAPH_HEIGHT);
            setupCanvas(stCanvas, sview, GRAPH_WIDTH, GRAPH_HEIGHT);
            if (lastDraw) {
                drawScene(simT, lastDraw.drawA, lastDraw.drawB);
            } else {
                const bw = BLOCK_W_M;
                const sx0 = P.v0A >= P.v0B ? 0 : P.L - bw;
                drawScene(0, { x: sx0, v: P.v0A, onPlate: true }, { x: 0, v: P.v0B });
            }
            drawCharts();
        }

        // ========== 数据面板 ==========
        function updateDataPanel() {
            if (!sim) return;
            const elTEndLabel = elTEnd.parentElement?.querySelector('span');

            // B 静止、A 停板上（需求 19）：显示 A 停止时刻与 0.00 m/s
            if (!sim.bMovedEver && !sim.willSlideOff && sim.tStop !== null) {
                elTEnd.textContent = sim.tStop.toFixed(2) + ' s';
                elVFin.textContent = '0.00 m/s';
                if (elTEndLabel) elTEndLabel.textContent = 'A 停止时刻';
            } else {
                elTEnd.textContent = sim.willSlideOff ? '—' : (sim.t1 !== null ? sim.t1.toFixed(2) + ' s' : '—');
                elVFin.textContent = sim.willSlideOff ? '—' : (sim.vCommon !== null ? sim.vCommon.toFixed(2) + ' m/s' : '—');
                if (elTEndLabel) elTEndLabel.textContent = '共速时刻';
            }
            elRel.textContent  = sim.sRel1.toFixed(2) + ' m';
            elSlide.textContent = sim.willSlideOff ? '✓ 滑出' : '✗ 未滑出';
            elSlide.style.color = sim.willSlideOff ? '#ff6644' : '#33dd66';
            elHeat.textContent = sim.heat.toFixed(2) + ' J';
            elMass.textContent = P.mA.toFixed(1) + ' + ' + P.mB.toFixed(1) + ' kg';

            if (state === 'idle') {
                if (sim.tExit !== null) {
                    elStatus.textContent = `当前参数：物体将未停止越出运动区域，演示于 t = ${sim.tExit.toFixed(1)} s 提前结束。`;
                } else if (sim.willSlideOff) {
                    const edge = sim.offEdge === 'back' ? '后' : '前';
                    elStatus.textContent = `当前参数：相对滑移将达板长，A 会从${edge}缘滑出。`;
                } else if (!sim.bMovedEver) {
                    elStatus.textContent = `当前参数：B 保持静止，A 将在板上滑行 ${sim.sRel1.toFixed(1)} m 后停下。`;
                } else if (sim.slipAfter) {
                    elStatus.textContent = '当前参数：μ₁ < μ₂，共速后静摩擦不足以锁死，将再次相对滑动。';
                } else if (sim.mu2 > 0) {
                    elStatus.textContent = '当前参数：μ₁≥μ₂ 且能带动 B，共速后将锁死并一起减速。';
                } else {
                    elStatus.textContent = '当前参数：μ₂ = 0，共速后将一起匀速运动。';
                }
            }
        }

        // ========== 预览态重绘：初始布局 + 图表（idle 参数联动共用） ==========
        function redrawPreview() {
            const bw = BLOCK_W_M;
            const sx0 = P.v0A >= P.v0B ? 0 : P.L - bw;
            const drawA = { x: sx0, v: P.v0A, onPlate: true };
            const drawB = { x: 0, v: P.v0B };
            lastDraw = { drawA, drawB };
            drawScene(0, drawA, drawB);
            drawCharts();
        }

        // ========== 参数预览守卫：结束态拖动滑条时自动回到预览态 ==========
        function previewGuard() {
            if (state === 'running') return false;
            if (state === 'ended') {
                state = 'idle';
                simT = 0;
                playIdx = 0;
                slideOffTriggered = false;
                elVA.textContent = P.v0A.toFixed(2) + ' m/s';
                elVB.textContent = P.v0B.toFixed(2) + ' m/s';
                elVR.textContent = '—';
                elState.textContent = '待开始';
                elState.style.color = '#99aabb';
                elStatus.textContent = '';
                btnStart.disabled = false;
                btnReset.disabled = true;
                redrawPreview();
            }
            return true;
        }

        // ========== 控制 ==========
        function start() {
            if (state === 'running') return;
            reset(true);

            state = 'idle';
            simT = 0;
            lastTs = null;
            playIdx = 0;
            slideOffTriggered = false;
            elStatus.textContent = '';

            updateDataPanel();

            state = 'running';
            btnStart.disabled = true;
            btnReset.disabled = false;
            elV0A.disabled = true;
            elV0B.disabled = true;
            elMA.disabled = true;
            elMB.disabled = true;
            elMu.disabled = true;
            elMu2.disabled = true;
            elL.disabled = true;
            elTs.disabled = true;

            redrawPreview();

            animId = requestAnimationFrame(frame);
        }

        function reset(silent) {
            if (animId) { cancelAnimationFrame(animId); animId = null; }
            state = 'idle';
            simT = 0;
            lastTs = null;
            playIdx = 0;
            slideOffTriggered = false;

            P.v0A = parseFloat(elV0A.value) || 12;
            P.v0B = parseFloat(elV0B.value) / 10;
            P.mA  = parseFloat(elMA.value) / 10;
            P.mB  = parseFloat(elMB.value) / 10;
            P.mu  = parseFloat(elMu.value) / 100;
            P.mu2 = parseFloat(elMu2.value) / 100;
            P.L   = parseFloat(elL.value) || 6;
            timeScale = parseFloat(elTs.value) / 10;

            elV0AVal.textContent = P.v0A.toFixed(1) + ' m/s';
            elV0BVal.textContent = P.v0B.toFixed(1) + ' m/s';
            elMAVal.textContent  = P.mA.toFixed(1) + ' kg';
            elMBVal.textContent  = P.mB.toFixed(1) + ' kg';
            elMuVal.textContent  = P.mu.toFixed(2);
            elMu2Val.textContent = P.mu2.toFixed(2);
            elLVal.textContent   = P.L.toFixed(1) + ' m';
            elTsVal.textContent  = timeScale.toFixed(1) + '×';

            elVA.textContent = P.v0A.toFixed(2) + ' m/s';
            elVB.textContent = P.v0B.toFixed(2) + ' m/s';
            elVR.textContent = '—';
            elState.textContent = '待开始';
            elState.style.color = '#99aabb';
            elStatus.textContent = '';

            // 重置数据面板标签（需求 19）
            const elTEndLabel = elTEnd.parentElement?.querySelector('span');
            if (elTEndLabel) elTEndLabel.textContent = '共速时刻';
            elTEnd.textContent = '—';
            elVFin.textContent = '—';

            elV0A.disabled = false;
            elV0B.disabled = false;
            elMA.disabled = false;
            elMB.disabled = false;
            elMu.disabled = false;
            elMu2.disabled = false;
            elL.disabled = false;
            elTs.disabled = false;

            sim = simulate();
            updateDataPanel();

            btnStart.disabled = false;
            btnReset.disabled = true;

            redrawPreview();
        }

        // ========== 事件绑定 ==========
        elV0A.addEventListener('input', () => {
            P.v0A = parseFloat(elV0A.value);
            elV0AVal.textContent = P.v0A.toFixed(1) + ' m/s';
            if (!previewGuard()) return;
            elVA.textContent = P.v0A.toFixed(2) + ' m/s';
            sim = simulate();
            updateDataPanel();
            redrawPreview();
        });

        elV0B.addEventListener('input', () => {
            P.v0B = parseFloat(elV0B.value) / 10;
            elV0BVal.textContent = P.v0B.toFixed(1) + ' m/s';
            if (!previewGuard()) return;
            elVB.textContent = P.v0B.toFixed(2) + ' m/s';
            sim = simulate();
            updateDataPanel();
            redrawPreview();
        });

        elMA.addEventListener('input', () => {
            P.mA = parseFloat(elMA.value) / 10;
            elMAVal.textContent = P.mA.toFixed(1) + ' kg';
            if (!previewGuard()) return;
            sim = simulate();
            updateDataPanel();
            redrawPreview();
        });

        elMB.addEventListener('input', () => {
            P.mB = parseFloat(elMB.value) / 10;
            elMBVal.textContent = P.mB.toFixed(1) + ' kg';
            if (!previewGuard()) return;
            sim = simulate();
            updateDataPanel();
            redrawPreview();
        });

        elMu.addEventListener('input', () => {
            P.mu = parseFloat(elMu.value) / 100;
            elMuVal.textContent = P.mu.toFixed(2);
            if (!previewGuard()) return;
            sim = simulate();
            updateDataPanel();
            redrawPreview();
        });

        elMu2.addEventListener('input', () => {
            P.mu2 = parseFloat(elMu2.value) / 100;
            elMu2Val.textContent = P.mu2.toFixed(2);
            if (!previewGuard()) return;
            sim = simulate();
            updateDataPanel();
            redrawPreview();
        });

        elL.addEventListener('input', () => {
            P.L = parseFloat(elL.value);
            elLVal.textContent = P.L.toFixed(1) + ' m';
            if (!previewGuard()) return;
            sim = simulate();
            updateDataPanel();
            redrawPreview();
        });

        elTs.addEventListener('input', () => {
            timeScale = parseFloat(elTs.value) / 10;
            elTsVal.textContent = timeScale.toFixed(1) + '×';
        });

        btnStart.addEventListener('click', start);
        btnReset.addEventListener('click', () => reset(false));
        window.addEventListener('resize', resizeAll);
        if (typeof ResizeObserver !== 'undefined') {
            const observer = new ResizeObserver(resizeAll);
            observer.observe(canvas);
            observer.observe(graphCanvas);
            observer.observe(stCanvas);
        }

        // ========== 启动 ==========
        resizeAll();
        reset(true);
    })();
    </script>
</body>
</html>

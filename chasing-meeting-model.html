<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>追及相遇模型演示｜高中物理</title>
<meta name="description" content="追及相遇模型教学演示：匀速追匀速、匀速追匀变速、匀变速追匀速三类场景，可调初速度、加速度、初始距离与出发时间差，动画与 v-t、x-t 图实时联动，判别式 Δ 与速度相等极值判据随参数实时推导与判断。">
<!--
文件描述：追及相遇模型演示（参照平抛运动演示页布局改版）
页面布局：画布 → 图表 → 播放控制（含时间轴拖动） → 实时数值 → 参数设定 → 推导与判断 → 图例。
推导与判断随参数实时更新：位置表达式、速度相等极值判据、联立方程判别式 Δ 求解与能否追上的判定。
-->
<style>
:root { --cA:#2563eb; --cB:#f97316; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background-color: #eef2f6;
  color: #1f2937;
  font-family: system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 12px 32px;
}
main {
  width: 100%;
  max-width: 880px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
h1 {
  font-size: 22px;
  margin-bottom: 12px;
  text-align: center;
}
.canvas-wrap { width: 100%; }
canvas#animCanvas {
  display: block;
  width: 100%;
  aspect-ratio: 880 / 520;
  border: 2px solid #2563eb;
  border-radius: 10px;
  background-color: #ffffff;
}
.charts-row {
  margin-top: 16px;
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
@media (max-width: 720px) {
  .charts-row { grid-template-columns: 1fr; }
}
.param-group,
.data-group {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 14px 16px;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
}
.data-group {
  width: 100%;
  margin-top: 16px;
}
.chart-panel {
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 0;
}
.chart-panel .group-title {
  padding: 0 2px;
}
.group-title {
  font-size: 12px;
  color: #6b7280;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
}
.chart-panel canvas {
  display: block;
  width: 100%;
  aspect-ratio: 20 / 9;
  background: #ffffff;
  border: 2px solid #2563eb;
  border-radius: 10px;
}
.play-bar {
  margin-top: 12px;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.play-bar select {
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 13px;
  background: #fff;

}
.play-bar input[type=range] { flex: 1; min-width: 160px; accent-color: #2563eb; }
.timeLabel {
  font-variant-numeric: tabular-nums;

}
.control-panel {

}

input[type=range]:disabled { opacity: 0.45; cursor: not-allowed; }

}
.param-row input[type=range] { flex: 1; accent-color: #2563eb; }
.param-row input[type=number] {

  border: 1px solid #e5e7eb;
  border-radius: 8px;

}
.param-row select {

<body>
<main>
<h1>追及相遇模型演示</h1>
<div class="canvas-wrap">
  <canvas id="animCanvas" role="img" aria-label="追及相遇动画：物体 A 与物体 B 在同一直线上运动，可显示相遇点与实时距离"></canvas>
</div>

<div class="charts-row">
  <section class="chart-panel">
    <div class="group-title">速度-时间图 (v-t)</div>
    <canvas id="vtCanvas" role="img" aria-label="A、B 速度随时间变化图像，含速度相等与追及相遇时刻标注，阴影为位移差"></canvas>
  </section>
  <section class="chart-panel">

    <canvas id="xtCanvas" role="img" aria-label="A、B 位置随时间变化图像，两线交点即相遇"></canvas>
  </section>
</div>

<div class="play-bar">
  <button id="btnPlay" type="button">开始</button>
  <button id="btnPauseResume" type="button" disabled>暂停</button>
  <button id="btnReset" type="button">重置</button>
  <select id="speedSel" title="播放速度" aria-label="播放速度倍率">
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="4">4×</option>
  </select>
  <input type="range" id="timeSlider" min="0" max="15" step="0.01" value="0" title="时间轴（可拖动回看）" aria-label="时间进度">
  <span class="timeLabel" id="timeLabel">0.00 s</span>
</div>

<section class="data-group" aria-labelledby="dataTitle" aria-live="polite">
  <div class="group-title" id="dataTitle">实时数值</div>
  <div class="data-grid">
    <div class="data-item"><span>当前时间 t</span><b id="dT">—</b></div>
    <div class="data-item"><span>A 的位置 x<sub>A</sub></span><b id="dXA" class="cA">—</b></div>
    <div class="data-item"><span>B 的位置 x<sub>B</sub></span><b id="dXB" class="cB">—</b></div>
    <div class="data-item"><span>A 的速度 v<sub>A</sub></span><b id="dVA" class="cA">—</b></div>
    <div class="data-item"><span>B 的速度 v<sub>B</sub></span><b id="dVB" class="cB">—</b></div>
    <div class="data-item"><span>相对距离 |x<sub>B</sub> − x<sub>A</sub>|</span><b id="dGap">—</b></div>
    <div class="data-item"><span>相对速度 v<sub>A</sub> − v<sub>B</sub></span><b id="dVrel">—</b></div>
    <div class="data-item"><span>速度相等时刻 t<sup>*</sup></span><b id="dTstar">—</b></div>
    <div class="data-item"><span>间距极值预测</span><b id="dExt">—</b></div>
    <div class="data-item"><span>当前状态</span><b id="dState">—</b></div>
  </div>
</section>

<div class="control-panel">
  <section class="param-group" aria-labelledby="parameterTitle">
    <div class="group-title" id="parameterTitle">参数设定</div>
    <div class="param-row">
      <label for="presetSel">场景预设</label>
      <select id="presetSel">
        <optgroup label="一、匀速追匀速">
          <option value="p1">快车追慢车（能追上）</option>
          <option value="p2">慢车追快车（追不上）</option>
          <option value="p3">同速追及（间距恒定·临界）</option>
          <option value="p4">晚出发的追及（A 晚 2 s）</option>
          <option value="p5">相向而行（相遇）</option>
          <option value="p6">背向而行（远离）</option>
        </optgroup>
        <optgroup label="二、匀速追匀变速">
          <option value="p7">匀速追刹车（停前追上）</option>
          <option value="p8">匀速追刹车（停后追上）</option>
          <option value="p9">匀速追起步加速（两次相遇）</option>
          <option value="p10">匀速追起步加速（追不上）</option>
        </optgroup>
        <optgroup label="三、匀变速追匀速">
          <option value="p11">刹车追匀速（临界·刚好追上）</option>
          <option value="p12">起步加速追匀速（经典追及）</option>
          <option value="p13">刹车追匀速（追不上·最近距离）</option>
        </optgroup>
        <option value="custom" disabled hidden>— 自定义 —</option>
      </select>
    </div>
    <div class="radios">
      <label><input type="radio" name="mode" value="same" checked> 同向（都向右）</label>
      <label><input type="radio" name="mode" value="toward"> 相向（A→右，B→左）</label>
      <label><input type="radio" name="mode" value="apart"> 背向（A→左，B→右）</label>
    </div>
    <div class="param-row">
      <label for="d">初始距离 d (m)</label>
      <input type="range" id="d" min="0" max="80" step="1" value="20">
      <input type="number" id="dN" min="0" max="80" step="1" value="20">
    </div>
    <div class="param-row">
      <label for="vA">A 初速度 (m/s)</label>
      <input type="range" id="vA" min="0" max="25" step="0.5" value="10">
      <input type="number" id="vAn" min="0" max="25" step="0.5" value="10">
    </div>
    <div class="param-row">
      <label for="vB">B 初速度 (m/s)</label>
      <input type="range" id="vB" min="0" max="25" step="0.5" value="6">
      <input type="number" id="vBn" min="0" max="25" step="0.5" value="6">
    </div>
    <div class="param-row">
      <label for="aA">A 加速度 (m/s²)</label>
      <input type="range" id="aA" min="-6" max="6" step="0.5" value="0">
      <input type="number" id="aAn" min="-6" max="6" step="0.5" value="0">
    </div>
    <div class="param-row">
      <label for="aB">B 加速度 (m/s²)</label>
      <input type="range" id="aB" min="-6" max="6" step="0.5" value="0">
      <input type="number" id="aBn" min="-6" max="6" step="0.5" value="0">
    </div>
    <div class="param-row">
      <label for="dt">A 晚出发 Δt (s)</label>
      <input type="range" id="dt" min="0" max="5" step="0.5" value="0">
      <input type="number" id="dtN" min="0" max="5" step="0.5" value="0">
    </div>
    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="ckBrake" checked> 刹车减速到 0 即停下（不倒车）</label>
      <label class="toggle"><input type="checkbox" id="ckDist" checked> 实时距离标注</label>
      <label class="toggle"><input type="checkbox" id="ckKey" checked> 显示关键点</label>
      <label class="toggle"><input type="checkbox" id="ckArea" checked> v-t 面积差提示</label>
    </div>
  </section>
</div>

<section class="formula-card">
  <div class="group-title">推导与判断（随参数实时更新）</div>
  <div class="formula" id="formulaBox"></div>
  <div class="result ok" id="resultBox"></div>
</section>

<div class="legend">
  <span>● 物体 A（蓝）／ 物体 B（橙）</span>
  <span>曲线与圆点：v-t、x-t 中 A、B 同色对应</span>
  <span>竖虚线：追及 / 相遇 / 速度相等时刻</span>
  <span>x-t 图两线交点即相遇</span>
  <span>⌨ 空格 = 播放/暂停　R = 重置</span>
</div>
</main>

<script>
"use strict";
const PRESETS = {
  p1:{mode:'same',d:20,vA:10,vB:6,aA:0,aB:0,dt:0},
  p2:{mode:'same',d:20,vA:6,vB:10,aA:0,aB:0,dt:0},
  p3:{mode:'same',d:20,vA:6,vB:6,aA:0,aB:0,dt:0},
  p4:{mode:'same',d:15,vA:8,vB:5,aA:0,aB:0,dt:2},
  p5:{mode:'toward',d:30,vA:8,vB:7,aA:0,aB:0,dt:0},
  p6:{mode:'apart',d:20,vA:5,vB:5,aA:0,aB:0,dt:0},
  p7:{mode:'same',d:15,vA:10,vB:8,aA:0,aB:-2,dt:0},
  p8:{mode:'same',d:10,vA:6,vB:8,aA:0,aB:-2,dt:0},
  p9:{mode:'same',d:20,vA:10,vB:0,aA:0,aB:2,dt:0},
  p10:{mode:'same',d:30,vA:5,vB:0,aA:0,aB:2,dt:0},
  p11:{mode:'same',d:4,vA:10,vB:6,aA:-2,aB:0,dt:0},
  p12:{mode:'same',d:16,vA:0,vB:6,aA:2,aB:0,dt:0},
  p13:{mode:'same',d:15,vA:10,vB:4,aA:-2,aB:0,dt:0}
};
const P = {mode:'same', d:20, vA:10, vB:6, aA:0, aB:0, dt:0, brake:true};
const EPS = 1e-9;
const HORIZON = 400;

function dirA(){ return P.mode === 'apart' ? -1 : 1; }
function dirB(){ return P.mode === 'toward' ? -1 : 1; }
function brakeStopT(dt, v0, a){
  if (!P.brake || a === 0 || v0 === 0 || v0 * a >= 0) return Infinity;
  return dt + Math.abs(v0 / a);
}
let OA = null, OB = null;
function mkA(){ const v0 = dirA()*P.vA, a = dirA()*P.aA; return {x0:0, v0, a, dt:P.dt, stop:brakeStopT(P.dt, v0, a)}; }
function mkB(){ const v0 = dirB()*P.vB, a = dirB()*P.aB; return {x0:P.d, v0, a, dt:0, stop:brakeStopT(0, v0, a)}; }
function st(o, t){
  if (t < o.dt - EPS) return {x:o.x0, v:0, a:0, w:true};
  const tau = Math.max(0, t - o.dt);
  const sTau = o.stop === Infinity ? Infinity : o.stop - o.dt;
  if (tau >= sTau - EPS){
    return {x:o.x0 + o.v0*sTau + 0.5*o.a*sTau*sTau, v:0, a:0, s:true};
  }
  return {x:o.x0 + o.v0*tau + 0.5*o.a*tau*tau, v:o.v0 + o.a*tau, a:o.a, r:true};
}
function xA(t){ return st(OA, t).x; }
function xB(t){ return st(OB, t).x; }
function vAo(t){ return st(OA, t).v; }
function vBo(t){ return st(OB, t).v; }

function bounds(T){
  const bs = new Set([0, T]);
  [OA, OB].forEach(o => {
    if (o.dt > EPS && o.dt < T) bs.add(o.dt);
    if (isFinite(o.stop) && o.stop < T) bs.add(o.stop);
  });
  return [...bs].sort((a, b) => a - b);
}
function quadRoots(a, b, c){
  const out = [];
  if (Math.abs(a) < EPS){
    if (Math.abs(b) > EPS) out.push(-c/b);
  } else {
    const disc = b*b - 4*a*c;
    if (disc >= 0){
      const sq = Math.sqrt(disc);
      out.push((-b - sq)/(2*a), (-b + sq)/(2*a));
    }
  }
  return out;
}
function solve(){
  OA = mkA(); OB = mkB();
  const meetings = [];
  const tCands = [];
  const seen = new Set();
  const bs = bounds(HORIZON);
  for (let i = 0; i < bs.length - 1; i++){
    const t1 = bs[i], t2 = bs[i+1];
    const sa = st(OA, t1), sb = st(OB, t1);
    const u2 = t2 - t1;
    const c2 = 0.5*(sa.a - sb.a), c1 = sa.v - sb.v, c0 = sa.x - sb.x;
    quadRoots(c2, c1, c0).forEach(u => {
      if (u < -EPS || u > u2 + EPS) return;
      const uu = Math.min(u2, Math.max(0, u));
      const tm = t1 + uu;
      const key = tm.toFixed(4);
      if (seen.has(key)) return;
      seen.add(key);
      meetings.push({t:tm, x:xA(tm)});
    });
    const da = sa.a - sb.a;
    if (Math.abs(da) > EPS){
      const u = -(sa.v - sb.v)/da;
      if (u > EPS && u < u2 - EPS){
        const tm = t1 + u;
        tCands.push({t:tm, gap:Math.abs(xA(tm) - xB(tm)), sign:da});
      }
    }
  }
  meetings.sort((a, b) => a.t - b.t);
  let tmin = null, tmax = null;
  tCands.forEach(c => {
    if (c.sign < 0){ if (!tmin || c.gap < tmin.gap) tmin = c; }
    else { if (!tmax || c.gap > tmax.gap) tmax = c; }
  });
  const bothUniform = Math.abs(OA.a) < EPS && Math.abs(OB.a) < EPS;
  const critical = bothUniform && Math.abs(OA.v0 - OB.v0) < EPS && meetings.length === 0;
  let criticalGap = null;
  if (critical) criticalGap = Math.abs(xB(OA.dt) - xA(OA.dt));
  const tms = meetings.map(m => m.t);
  let T;
  if (tms.length) T = Math.max(...tms) + 3;
  else if (tmin) T = Math.max(tmin.t + 3, 12);
  else if (tmax) T = Math.max(tmax.t + 3, 12);
  else T = 15;
  if (critical) T = Math.max(T, 12);
  T = Math.min(HORIZON, Math.max(6, +T.toFixed(2)));
  const t1m = Math.max(OA.dt, OB.dt);
  const bsm = bounds(T);
  let segEnd = T;
  for (let i = bsm.length - 1; i >= 0; i--){
    if (bsm[i] <= t1m + EPS){ segEnd = (i + 1 < bsm.length) ? bsm[i+1] : T; break; }
  }
  const sma = st(OA, t1m), smb = st(OB, t1m);
  const m2 = 0.5*(sma.a - smb.a), m1 = sma.v - smb.v, m0 = sma.x - smb.x;
  const uEnd = segEnd - t1m;
  const mainRoots = quadRoots(m2, m1, m0)
    .filter(u => u > EPS && u <= uEnd + EPS)
    .map(u => Math.min(uEnd, u) + t1m)
    .sort((a, b) => a - b);
  const mainSet = new Set(mainRoots.map(x => x.toFixed(4)));
  const extra = meetings.filter(m => !mainSet.has(m.t.toFixed(4)));
  return {T, meetings, tmin, tmax, critical, criticalGap,
          main:{t0:t1m, A:m2, B:m1, C:m0, delta:m1*m1 - 4*m2*m0, roots:mainRoots, uEnd},
          extra};
}

let sol = solve();
let T = sol.T;
let t = 0;

function f2(x){ return (Math.round(x * 100) / 100).toFixed(2); }
function f1(x){ return (Math.round(x * 10) / 10).toFixed(1); }
function sgn(v){ return (v >= 0 ? '+' : '') + f2(v); }
function niceStep(range, n){
  const raw = range / n;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw / p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
}

function boot(){
  const el = id => document.getElementById(id);
  const btnPlay = el('btnPlay'), btnPauseResume = el('btnPauseResume'), timeSlider = el('timeSlider'), timeLabel = el('timeLabel');
  const ckKey = el('ckKey'), ckDist = el('ckDist'), ckArea = el('ckArea'), ckBrake = el('ckBrake');
  const cA = getComputedStyle(document.documentElement).getPropertyValue('--cA').trim();
  const cB = getComputedStyle(document.documentElement).getPropertyValue('--cB').trim();

  let playing = false, lastTs = null, speed = 1;

  function setPlaying(p){
    playing = p;
    if (p){ lastTs = null; requestAnimationFrame(loop); }
    setButtons();
  }
  // 标准三按钮状态矩阵（开始 | 暂停/继续 | 重置）
  function setButtons(){
    const ended = t >= T - EPS;
    if (playing){
      btnPlay.disabled = true; btnPlay.textContent = '运行中…';
      btnPauseResume.disabled = false; btnPauseResume.textContent = '暂停';
      btnReset.disabled = true;
    } else if (ended){
      btnPlay.disabled = false; btnPlay.textContent = '重新开始';
      btnPauseResume.disabled = true; btnPauseResume.textContent = '暂停';
      btnReset.disabled = false;
    } else if (t > EPS){
      btnPlay.disabled = false; btnPlay.textContent = '重新开始';
      btnPauseResume.disabled = false; btnPauseResume.textContent = '继续';
      btnReset.disabled = false;
    } else {
      btnPlay.disabled = false; btnPlay.textContent = '开始';
      btnPauseResume.disabled = true; btnPauseResume.textContent = '暂停';
      btnReset.disabled = false;
    }
  }
  function loop(ts){
    if (!playing){ lastTs = null; return; }
    if (lastTs == null) lastTs = ts;
    t = Math.min(T, t + (ts - lastTs) / 1000 * speed);
    lastTs = ts;
    syncTime(); render();
    if (t >= T){ setPlaying(false); } else { requestAnimationFrame(loop); }
  }
  function syncTime(){
    timeSlider.value = t;
    timeLabel.textContent = `${f2(t)} s / ${f2(T)} s`;
  }

  function prep(cv){
    const ctx = cv.getContext('2d');
    const W = cv.clientWidth, H = cv.clientHeight;
    ctx.clearRect(0, 0, W, H);
    return {ctx, W, H};
  }
  function worldRange(){
    let lo = 0, hi = P.d;
    const N = 200;
    for (let i = 0; i <= N; i++){
      const tt = T * i / N;
      const a = xA(tt), b = xB(tt);
      if (a < lo) lo = a; if (a > hi) hi = a;
      if (b < lo) lo = b; if (b > hi) hi = b;
    }
    const pad = Math.max(2, (hi - lo) * 0.08);
    return [lo - pad, hi + pad];
  }
  function arrow(ctx, x1, y1, x2, y2, color, both){
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const head = (x, y, s) => {
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.lineTo(x - s * (x2 >= x1 ? 1 : -1), y - s * 0.55);
      ctx.lineTo(x - s * (x2 >= x1 ? 1 : -1), y + s * 0.55);
      ctx.closePath(); ctx.fill();
    };
    head(x2, y2, 7);
    if (both) head(x1, y1, 7);
  }
  function drawBall(ctx, x, y, r, ch, color, phase){
    ctx.save();
    if (phase === 'w') ctx.globalAlpha = 0.45;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    if (phase === 'w'){
      ctx.strokeStyle = color; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, r + 4, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
  function drawAnim(){
    const {ctx, W, H} = prep(el('animCanvas'));
    const [wlo, whi] = worldRange();
    const mL = 24, mR = 24;
    const y0 = Math.round(H * 2 / 3);
    const X = x => mL + (x - wlo) / (whi - wlo) * (W - mL - mR);
    ctx.font = '11px system-ui, sans-serif';

    ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(mL - 8, y0); ctx.lineTo(W - mR + 8, y0); ctx.stroke();

    const step = niceStep(whi - wlo, 8);
    const dec = step >= 1 ? 0 : 1;
    ctx.fillStyle = '#9ca3af'; ctx.textAlign = 'center';
    for (let x = Math.ceil(wlo / step) * step; x <= whi + EPS; x += step){
      const sx = X(x);
      ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx, y0); ctx.lineTo(sx, y0 + 5); ctx.stroke();
      ctx.fillText(x.toFixed(dec), sx, y0 + 17);
    }
    ctx.textAlign = 'right';
    ctx.fillText('x/m', W - 6, y0 + 17);

    if (sol.meetings.length){
      sol.meetings.forEach((m, i) => {
        const xm = X(m.x);
        ctx.strokeStyle = '#92400e'; ctx.fillStyle = '#92400e'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(xm, y0); ctx.lineTo(xm, y0 - 56); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(xm, y0 - 56); ctx.lineTo(xm + 14, y0 - 50); ctx.lineTo(xm, y0 - 44); ctx.closePath(); ctx.fill();
        if (ckKey.checked){
          ctx.textAlign = 'center';
          ctx.fillText(sol.meetings.length > 1 ? `相遇${i+1} t=${f2(m.t)}s` : `相遇点 ${f2(m.x)} m`, xm, y0 - 62);
        }
      });
    }
    const mark = (x, label) => {
      const sx = X(x);
      ctx.strokeStyle = '#c7cdd6'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx, y0 + 4); ctx.lineTo(sx, y0 - 46); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#9ca3af'; ctx.textAlign = 'center';
      ctx.fillText(label, sx, y0 - 50);
    };
    mark(0, 'A出发 0');
    mark(P.d, `B出发 ${f1(P.d)}m`);

    const sa = st(OA, t), sb = st(OB, t);
    const cx = X(sa.x), dx = X(sb.x);
    const cy = y0 - 14;
    const R = 14;
    const sep = Math.abs(dx - cx);
    const overlap = sep < R + 2;

    if (ckDist.checked && sep > 34){
      const yy = y0 - 42;
      arrow(ctx, Math.min(cx, dx) + R + 2, yy, Math.max(cx, dx) - R - 2, yy, '#6b7280', true);
      ctx.fillStyle = '#4b5563'; ctx.textAlign = 'center';
      ctx.fillText(`${f2(Math.abs(sb.x - sa.x))} m`, (cx + dx) / 2, yy - 6);
    }

    drawBall(ctx, cx, cy, R, 'A', cA, sa.w ? 'w' : sa.s ? 's' : 'r');
    if (sa.w){
      ctx.fillStyle = '#9ca3af'; ctx.textAlign = 'center'; ctx.font = '11px system-ui, sans-serif';
      ctx.fillText('未出发', cx, cy - R - 8);
    }
    if (sa.s){
      ctx.fillStyle = '#9ca3af'; ctx.textAlign = 'center'; ctx.font = '11px system-ui, sans-serif';
      ctx.fillText('已停', cx, cy + R + 12);
    }
    if (Math.abs(sa.v) > EPS){
      const dir = sa.v > 0 ? 1 : -1;
      const len = Math.min(8 + Math.abs(sa.v) * 1.8, 26);
      arrow(ctx, cx + dir * (R + 2), cy, cx + dir * (R + 2 + len), cy, cA, false);
    }

    if (overlap){
      const coreR = sep < R ? R * 0.58 : R;
      drawBall(ctx, dx, cy, coreR, 'B', cB, sb.w ? 'w' : sb.s ? 's' : 'r');
      ctx.fillStyle = cA; ctx.textAlign = 'center'; ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.fillText('A', cx, cy - R - 5);
      ctx.fillStyle = '#fff';
      ctx.fillText('B', dx, cy + 4);
    } else {
      drawBall(ctx, dx, cy, R, 'B', cB, sb.w ? 'w' : sb.s ? 's' : 'r');
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.fillText('B', dx, cy + 4);
    }
    if (sb.w){
      ctx.fillStyle = '#9ca3af'; ctx.textAlign = 'center'; ctx.font = '11px system-ui, sans-serif';
      ctx.fillText('未出发', dx, cy - R - 8);
    }
    if (sb.s){
      ctx.fillStyle = '#9ca3af'; ctx.textAlign = 'center'; ctx.font = '11px system-ui, sans-serif';
      ctx.fillText('已停', dx, cy + R + 12);
    }
    if (Math.abs(sb.v) > EPS){
      const dir = sb.v > 0 ? 1 : -1;
      const len = Math.min(8 + Math.abs(sb.v) * 1.8, 26);
      arrow(ctx, dx + dir * (R + 2), cy, dx + dir * (R + 2 + len), cy, cB, false);
    }

    if (sol.meetings.length){
      sol.meetings.forEach((m, i) => {
        const dd = t - m.t;
        if (dd >= 0 && dd <= 0.8){
          const p = dd / 0.8;
          ctx.strokeStyle = `rgba(220,38,38,${1 - p})`; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(X(m.x), cy - 6, 16 + 14 * p, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = '#dc2626'; ctx.textAlign = 'center'; ctx.font = 'bold 13px system-ui, sans-serif';
          const word = P.mode === 'same' ? (i === 0 ? '追上了！' : '再次相遇！') : '相遇！';
          ctx.fillText(word, X(m.x), y0 - 74);
        }
      });
    }
    ctx.font = '12px system-ui, sans-serif'; ctx.fillStyle = '#6b7280'; ctx.textAlign = 'right';
    ctx.fillText(`t = ${f2(t)} s`, W - 10, 16);
  }

  function chartFrame(o){
    const {ctx, W, H} = prep(o.cv);
    const mL = 46, mR = 14, mT = 18, mB = 26;
    const X = v => mL + (v - o.xlo) / (o.xhi - o.xlo) * (W - mL - mR);
    const Y = v => H - mB - (v - o.ylo) / (o.yhi - o.ylo) * (H - mT - mB);
    ctx.font = '10.5px system-ui, sans-serif';
    const xs = niceStep(o.xhi - o.xlo, 6), ys = niceStep(o.yhi - o.ylo, 5);
    ctx.strokeStyle = '#eef1f5'; ctx.lineWidth = 1; ctx.fillStyle = '#9ca3af';
    for (let v = Math.ceil(o.xlo / xs) * xs; v <= o.xhi + EPS; v += xs){
      ctx.beginPath(); ctx.moveTo(X(v), mT); ctx.lineTo(X(v), H - mB); ctx.stroke();
      ctx.textAlign = 'center'; ctx.fillText(+v.toFixed(3), X(v), H - mB + 13);
    }
    for (let v = Math.ceil(o.ylo / ys) * ys; v <= o.yhi + EPS; v += ys){
      ctx.beginPath(); ctx.moveTo(mL, Y(v)); ctx.lineTo(W - mR, Y(v)); ctx.stroke();
      ctx.textAlign = 'right'; ctx.fillText(+v.toFixed(3), mL - 5, Y(v) + 3.5);
    }
    ctx.strokeStyle = '#d1d5db';
    ctx.beginPath(); ctx.moveTo(mL, mT); ctx.lineTo(mL, H - mB); ctx.lineTo(W - mR, H - mB); ctx.stroke();
    ctx.textAlign = 'left'; ctx.fillText(o.yLabel, mL + 4, mT - 5);
    ctx.textAlign = 'right'; ctx.fillText('t/s', W - mR, H - mB + 13);
    return {ctx, X, Y, mL, mR, mT, mB, W, H};
  }
  function legend(g){
    g.ctx.font = '11px system-ui, sans-serif';
    g.ctx.textAlign = 'right';
    g.ctx.fillStyle = cA; g.ctx.fillText('— A', g.W - g.mR - 34, g.mT + 8);
    g.ctx.fillStyle = cB; g.ctx.fillText('— B', g.W - g.mR, g.mT + 8);
  }
  function playhead(g, yA, yB){
    const x = g.X(t);
    g.ctx.strokeStyle = '#374151'; g.ctx.lineWidth = 1.2;
    g.ctx.beginPath(); g.ctx.moveTo(x, g.mT); g.ctx.lineTo(x, g.H - g.mB); g.ctx.stroke();
    dot(g, x, yA, cA); dot(g, x, yB, cB);
  }
  function dot(g, x, y, c){
    if (!isFinite(y)) return;
    g.ctx.fillStyle = c;
    g.ctx.beginPath(); g.ctx.arc(x, y, 3.5, 0, Math.PI * 2); g.ctx.fill();
    g.ctx.strokeStyle = '#fff'; g.ctx.lineWidth = 1; g.ctx.stroke();
  }
  function vline(g, tt, label){
    const x = g.X(tt);
    g.ctx.strokeStyle = '#b0b7c3'; g.ctx.setLineDash([5, 4]); g.ctx.lineWidth = 1;
    g.ctx.beginPath(); g.ctx.moveTo(x, g.mT); g.ctx.lineTo(x, g.H - g.mB); g.ctx.stroke();
    g.ctx.setLineDash([]);
    if (label && ckKey.checked){
      g.ctx.fillStyle = '#92400e'; g.ctx.textAlign = 'center'; g.ctx.font = '10.5px system-ui, sans-serif';
      g.ctx.fillText(label, x, g.mT + 9);
    }
  }
  function chartBounds(){
    const set = new Set([0, T]);
    bounds(T).forEach(b => { if (b > EPS && b < T) set.add(b); });
    if (sol.tmin) set.add(sol.tmin.t);
    if (sol.tmax) set.add(sol.tmax.t);
    sol.meetings.forEach(m => set.add(m.t));
    return [...set].sort((a, b) => a - b);
  }
  function vAfter(o, tt){ return st(o, tt + 1e-6).v; }

  function drawVT(){
    const N = 240;
    let lo = 0, hi = 0;
    const pts = {A:[], B:[]};
    for (let i = 0; i <= N; i++){
      const tt = T * i / N;
      const va = vAo(tt), vb = vBo(tt);
      pts.A.push([tt, va]); pts.B.push([tt, vb]);
      lo = Math.min(lo, va, vb); hi = Math.max(hi, va, vb);
    }
    if (hi - lo < 1e-9){ lo -= 1; hi += 1; } else { const p = (hi - lo) * 0.18; lo -= p; hi += p; }
    const g = chartFrame({cv: el('vtCanvas'), xlo: 0, xhi: T, ylo: lo, yhi: hi, yLabel: 'v/(m/s)'});

    if (ckArea.checked){
      const tE = sol.meetings.length ? sol.meetings[0].t : T;
      const times = chartBounds().filter(tt => tt < tE - EPS).concat([tE]);
      if (tE > 0.05){
        g.ctx.fillStyle = 'rgba(139,92,246,0.14)';
        g.ctx.beginPath();
        times.forEach((tt, i) => { const y = g.Y(vAo(tt)); i ? g.ctx.lineTo(g.X(tt), y) : g.ctx.moveTo(g.X(tt), y); });
        for (let i = times.length - 1; i >= 0; i--) g.ctx.lineTo(g.X(times[i]), g.Y(vBo(times[i])));
        g.ctx.closePath(); g.ctx.fill();
        if (tE > 0.6){
          const midT = tE / 2;
          const yMid = (vAo(midT) + vBo(midT)) / 2;
          if (Math.abs(g.Y(vAo(midT)) - g.Y(vBo(midT))) > 15 && g.Y(yMid) > g.mT + 14){
            g.ctx.fillStyle = '#7c3aed'; g.ctx.textAlign = 'center'; g.ctx.font = '10.5px system-ui, sans-serif';
            g.ctx.fillText('面积差＝位移差', g.X(midT), g.Y(yMid) + 3.5);
          }
        }
      }
    }

    const tStar = sol.tmin ? sol.tmin : sol.tmax;
    if (tStar) vline(g, tStar.t, `v相等(间距极值) t=${f2(tStar.t)}s`);
    sol.meetings.forEach(m => {
      if (tStar && Math.abs(m.t - tStar.t) < 1e-6) return;
      vline(g, m.t, `${P.mode === 'same' ? '追及' : '相遇'} t=${f2(m.t)}s`);
    });

    [pts.A, pts.B].forEach((arr, idx) => {
      g.ctx.strokeStyle = idx === 0 ? cA : cB; g.ctx.lineWidth = 2.2;
      g.ctx.beginPath();
      arr.forEach((p, i) => { i ? g.ctx.lineTo(g.X(p[0]), g.Y(p[1])) : g.ctx.moveTo(g.X(p[0]), g.Y(p[1])); });
      g.ctx.stroke();
    });

    playhead(g, g.Y(vAo(t)), g.Y(vBo(t)));
    legend(g);
  }

  function drawXT(){
    let lo = 0, hi = 0;
    const N = 240;
    for (let i = 0; i <= N; i++){
      const tt = T * i / N;
      lo = Math.min(lo, xA(tt), xB(tt)); hi = Math.max(hi, xA(tt), xB(tt));
    }
    if (hi - lo < 1e-9){ lo -= 1; hi += 1; } else { const p = (hi - lo) * 0.12; lo -= p; hi += p; }
    const g = chartFrame({cv: el('xtCanvas'), xlo: 0, xhi: T, ylo: lo, yhi: hi, yLabel: 'x/m'});

    const tStar = sol.tmin ? sol.tmin : sol.tmax;
    if (tStar) vline(g, tStar.t, `v相等(间距极值) t=${f2(tStar.t)}s`);
    sol.meetings.forEach(m => {
      if (tStar && Math.abs(m.t - tStar.t) < 1e-6) return;
      vline(g, m.t, `${P.mode === 'same' ? '追及' : '相遇'} t=${f2(m.t)}s`);
    });

    [[OA, cA], [OB, cB]].forEach(([o, col]) => {
      g.ctx.strokeStyle = col; g.ctx.lineWidth = 2.2;
      g.ctx.beginPath();
      for (let i = 0; i <= N; i++){
        const tt = T * i / N;
        const px = g.X(tt), py = g.Y(st(o, tt).x);
        i ? g.ctx.lineTo(px, py) : g.ctx.moveTo(px, py);
      }
      g.ctx.stroke();
    });

    if (sol.meetings.length && ckKey.checked){
      sol.meetings.forEach(m => {
        const px = g.X(m.t), py = g.Y(m.x);
        g.ctx.fillStyle = '#fff'; g.ctx.strokeStyle = '#92400e'; g.ctx.lineWidth = 2;
        g.ctx.beginPath(); g.ctx.arc(px, py, 4.5, 0, Math.PI * 2); g.ctx.fill(); g.ctx.stroke();
        g.ctx.fillStyle = '#92400e'; g.ctx.textAlign = 'left'; g.ctx.font = '10.5px system-ui, sans-serif';
        const tx = px + 8 > g.W - 92 ? px - 90 : px + 8;
        g.ctx.fillText(`(${f2(m.t)}, ${f2(m.x)})`, tx, py - 7);
      });
    }
    playhead(g, g.Y(xA(t)), g.Y(xB(t)));
    legend(g);
  }

  function phaseNote(o, name){
    const s = st(o, t);
    if (s.w) return `（${name} 未出发）`;
    if (s.s) return `（${name} 已停）`;
    return '';
  }
  function updateData(){
    el('dT').textContent = `${f2(t)} s`;
    el('dXA').textContent = `${f2(xA(t))} m`;
    el('dXB').textContent = `${f2(xB(t))} m`;
    const va = vAo(t), vb = vBo(t);
    el('dVA').textContent = sgn(va) + ' m/s';
    el('dVB').textContent = sgn(vb) + ' m/s';
    el('dGap').textContent = `${f2(Math.abs(xB(t) - xA(t)))} m`;
    el('dVrel').textContent = sgn(va - vb) + ' m/s';
    const ts = sol.tmin ? sol.tmin : sol.tmax;
    el('dTstar').textContent = ts ? `t = ${f2(ts.t)} s` : '—';
    if (sol.critical) el('dExt').textContent = `间距恒定 ${f2(sol.criticalGap)} m`;
    else if (sol.tmin) el('dExt').textContent = `最近 ${f2(sol.tmin.gap)} m @ t=${f2(sol.tmin.t)} s`;
    else if (sol.tmax) el('dExt').textContent = `最远 ${f2(sol.tmax.gap)} m @ t=${f2(sol.tmax.t)} s`;
    else el('dExt').textContent = '—';
    const cell = el('dState');
    const stt = stateText();
    cell.textContent = stt.text;
    cell.className = stt.hot ? 'state-hot' : '';
  }
  function stateText(){
    const passed = sol.meetings.filter(m => t >= m.t - EPS);
    if (passed.length){
      const last = passed.length;
      return {text: (P.mode === 'same' ? '已追上' : '已相遇') + (last > 1 ? `（第 ${last} 次）` : '') + phaseNote(OA, 'A') + phaseNote(OB, 'B'), hot: true};
    }
    const rel = xB(t) - xA(t);
    const rate = (vAo(t) - vBo(t)) * Math.sign(rel || 1);
    let s;
    if (Math.abs(rate) < EPS) s = '距离保持不变';
    else s = rate > 0 ? '接近中' : '远离中';
    s += phaseNote(OA, 'A') + phaseNote(OB, 'B');
    return {text: s, hot: false};
  }

  function exprTerm(o){
    const tau = o.dt > 0 ? `(t − ${f2(o.dt)})` : 't';
    let parts = [];
    if (Math.abs(o.v0) > EPS) parts.push(`${o.v0 > 0 ? '+ ' : '− '}${f2(Math.abs(o.v0))}${tau}`);
    if (Math.abs(o.a) > EPS) parts.push(`${o.a > 0 ? '+' : '−'} ${f2(Math.abs(o.a) / 2)}${tau}²`);
    let s = o.x0 !== 0 ? f2(o.x0) : '0';
    if (parts.length) s += ' ' + parts.join(' ');
    if (o.dt > 0) s += ` <span class="fnote">（t &lt; ${f2(o.dt)} s 时静止于 x=${f2(o.x0)} m）</span>`;
    if (isFinite(o.stop)){
      const sTau = o.stop - o.dt;
      const xs = o.x0 + o.v0 * sTau + 0.5 * o.a * sTau * sTau;
      s += ` <span class="fnote">（t ≥ ${f2(o.stop)} s 刹车停止于 x=${f2(xs)} m）</span>`;
    }
    return s;
  }
  function noMeetReason(){
    if (P.mode === 'apart') return '背向而行，间距 = d + (vA + vB)t 只增不减，不可能相遇';
    if (Math.abs(P.vA) < EPS && Math.abs(P.vB) < EPS) return '两物体速度均为 0，保持静止，不会相遇';
    if (sol.critical) return `同速：A 出发后两者间距恒定（${f2(sol.criticalGap)} m），永远追不上`;
    const bothUniform = Math.abs(OA.a) < EPS && Math.abs(OB.a) < EPS;
    if (bothUniform && P.mode === 'same') return 'B 的速度更大（vA < vB），距离不断增大，A 追不上 B';
    if (bothUniform && P.mode === 'toward') return '在观察区间内未相遇';
    if (sol.tmin) return `速度相等（t = ${f2(sol.tmin.t)} s）时仍相距 ${f2(sol.tmin.gap)} m，此后间距增大，追不上`;
    return '在观察区间内未相遇';
  }
  function buildFormula(){
    const sub = c => `<span class="fx f${c}">x<sub>${c}</sub></span>`;
    const subP = c => `<span class="fx f${c}">v<sub>${c}</sub></span>`;
    const posLine = `<div><span class="tag">位置表达式</span>${sub('A')} = ${exprTerm(OA)}　　${sub('B')} = ${exprTerm(OB)}</div>`;

    let starLine;
    if (sol.critical){
      starLine = `<div><span class="tag">速度相等</span><span class="fx fno">v<sub>A</sub> ≡ v<sub>B</sub>（临界）：相对速度恒为 0，间距恒定 ${f2(sol.criticalGap)} m</span></div>`;
    } else if (sol.tmin){
      starLine = `<div><span class="tag">速度相等</span>令 ${subP('A')} = ${subP('B')} → t<sup>*</sup> = <b>${f2(sol.tmin.t)} s</b>，此刻间距最小 = <b>${f2(sol.tmin.gap)} m</b>（速度相等即间距极值）</div>`;
    } else if (sol.tmax){
      starLine = `<div><span class="tag">速度相等</span>令 ${subP('A')} = ${subP('B')} → t<sup>*</sup> = <b>${f2(sol.tmax.t)} s</b>，此刻间距最大 = <b>${f2(sol.tmax.gap)} m</b>（速度相等即间距极值）</div>`;
    } else {
      starLine = `<div><span class="tag">速度相等</span><span class="fnote">匀速模型下相对速度恒定，不存在速度相等时刻（除临界外）</span></div>`;
    }

    const m = sol.main;
    const tau0 = m.t0 > EPS ? `(t − ${f2(m.t0)})` : 't';
    let eqStr, solveStr;
    const meetMain = m.roots.map(rt => `${f2(rt)} s`);
    if (Math.abs(m.A) < EPS){
      eqStr = `${sub('A')} = ${sub('B')} → ${f2(m.B)}${tau0} ${m.C >= 0 ? '+' : '−'} ${f2(Math.abs(m.C))} = 0`;
      solveStr = meetMain.length ? `→ t = <b>${meetMain.join(' s 或 ')}</b>` : '<span class="fno">该段无有效解</span>';
    } else {
      eqStr = `${sub('A')} = ${sub('B')} → ${f2(m.A)}${tau0}² ${m.B >= 0 ? '+' : '−'} ${f2(Math.abs(m.B))}${tau0} ${m.C >= 0 ? '+' : '−'} ${f2(Math.abs(m.C))} = 0`;
      const dv = m.delta;
      let rootTxt;
      if (m.roots.length === 2) rootTxt = `Δ = ${f2(dv)} &gt; 0，两个解 t₁ = ${f2(m.roots[0])} s，t₂ = ${f2(m.roots[1])} s（相遇两次，追上后反超）`;
      else if (m.roots.length === 1) rootTxt = `Δ = ${f2(dv)} ${Math.abs(dv) < 1e-6 ? '= 0（相切，临界）' : '&gt; 0'}，有效解 t = <b>${f2(m.roots[0])} s</b>`;
      else rootTxt = `Δ = ${f2(dv)} ${dv < 0 ? '&lt; 0，无实根' : '&gt; 0 但解不在有效区间'}，该段无有效解`;
      solveStr = rootTxt;
    }
    let extraTxt = '';
    if (sol.extra.length){
      extraTxt = '；' + sol.extra.map(x => `${x.t > (isFinite(OB.stop) ? OB.stop : Infinity) - EPS || st(OB, x.t).s ? 'B 停止后' : '后段'}于 t = ${f2(x.t)} s 相遇（x = ${f2(x.x)} m）`).join('；');
    }
    const solveLine = `<div><span class="tag">联立求解</span>${eqStr}　→　${solveStr}${extraTxt}</div>`;

    let judge;
    if (sol.meetings.length){
      const n = sol.meetings.length;
      const act = P.mode === 'same' ? (n > 1 ? `A 能追上 B（共 ${n} 次相遇）` : 'A 能追上 B') : '两物体相遇';
      judge = `<b>${act}</b>：${sol.meetings.map(mm => `t = ${f2(mm.t)} s（x = ${f2(mm.x)} m）`).join('；')}`;
    } else {
      judge = `<span class="fno">无解：${noMeetReason()}</span>` +
        (sol.critical ? '<br><span class="fnote">临界情形：vA = vB 时相对速度为零，间距不再变化。</span>' : '');
    }
    const judgeLine = `<div><span class="tag">判定依据</span>${judge}</div>`;

    el('formulaBox').innerHTML = posLine + starLine + solveLine + judgeLine;
  }
  function updateResult(){
    const box = el('resultBox');
    if (sol.meetings.length){
      box.className = 'result ok';
      const n = sol.meetings.length;
      const act = P.mode === 'same' ? (n > 1 ? `A 能追上 B（共 ${n} 次相遇）` : 'A 能追上 B') : '两物体相遇';
      box.innerHTML = `✔ <b>${act}</b>：${sol.meetings.map(mm => `t = <b>${f2(mm.t)} s</b>，x = <b>${f2(mm.x)} m</b>`).join('；')}`;
    } else {
      box.className = 'result no';
      const act = P.mode === 'same' ? 'A 追不上 B' : '两物体不会相遇';
      let extra = '';
      if (sol.tmin) extra = `<br>最近距离 ${f2(sol.tmin.gap)} m（t = ${f2(sol.tmin.t)} s，速度相等时刻）`;
      if (sol.critical) extra = '<br><span style="color:#6b7280">临界情形：vA = vB 时相对速度为零，间距不再变化。</span>';
      box.innerHTML = `✘ <b>${act}</b>：${noMeetReason()}${extra}`;
    }
  }

  function render(){ drawAnim(); drawVT(); drawXT(); updateData(); }
  function apply(){
    sol = solve(); T = sol.T;
    if (t > T) t = T;
    timeSlider.max = T;
    buildFormula(); updateResult(); syncTime(); render(); setButtons();
  }

  function markCustom(){ el('presetSel').value = 'custom'; }
  function bindPair(rid, nid, key){
    const r = el(rid), n = el(nid);
    const set = v => {
      v = Math.min(+r.max, Math.max(+r.min, +v || 0));
      P[key] = v; r.value = v; n.value = v;
      markCustom(); apply();
    };
    r.addEventListener('input', () => set(r.value));
    n.addEventListener('change', () => set(n.value));
  }
  bindPair('d', 'dN', 'd');
  bindPair('vA', 'vAn', 'vA');
  bindPair('vB', 'vBn', 'vB');
  bindPair('aA', 'aAn', 'aA');
  bindPair('aB', 'aBn', 'aB');
  bindPair('dt', 'dtN', 'dt');

  document.querySelectorAll('input[name=mode]').forEach(r =>
    r.addEventListener('change', () => { P.mode = r.value; markCustom(); apply(); }));
  [ckDist, ckKey, ckArea, ckBrake].forEach(c => c.addEventListener('change', () => { markCustom(); apply(); }));

  el('presetSel').addEventListener('change', e => {
    if (PRESETS[e.target.value]) loadPreset(e.target.value);
  });
  function loadPreset(key){
    const p = PRESETS[key];
    P.mode = p.mode; P.d = p.d; P.vA = p.vA; P.vB = p.vB; P.aA = p.aA; P.aB = p.aB; P.dt = p.dt; P.brake = true;
    el('d').value = p.d; el('dN').value = p.d;
    el('vA').value = p.vA; el('vAn').value = p.vA;
    el('vB').value = p.vB; el('vBn').value = p.vB;
    el('aA').value = p.aA; el('aAn').value = p.aA;
    el('aB').value = p.aB; el('aBn').value = p.aB;
    el('dt').value = p.dt; el('dtN').value = p.dt;
    el('ckBrake').checked = true;
    document.querySelectorAll('input[name=mode]').forEach(r => r.checked = r.value === p.mode);
    el('presetSel').value = key;
    t = 0; setPlaying(false); apply();
  }

  btnPlay.addEventListener('click', () => {
    if (playing) return;
    t = 0;
    setPlaying(true);
  });
  btnPauseResume.addEventListener('click', () => {
    if (playing){ setPlaying(false); }
    else if (t > EPS && t < T - EPS){ setPlaying(true); }
  });
  function doReset(){
    setPlaying(false);
    if (PRESETS[el('presetSel').value]) loadPreset(el('presetSel').value);
    else { t = 0; syncTime(); render(); }
  }
  el('btnReset').addEventListener('click', doReset);
  timeSlider.addEventListener('input', () => {
    setPlaying(false);
    t = Math.min(T, Math.max(0, parseFloat(timeSlider.value) || 0));
    syncTime(); render(); setButtons();
  });
  el('speedSel').addEventListener('change', e => { speed = parseFloat(e.target.value); });
  document.addEventListener('keydown', e => {
    if (/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)) return;
    if (e.code === 'Space'){
      e.preventDefault();
      if (playing){ setPlaying(false); }
      else if (t > EPS && t < T - EPS){ setPlaying(true); }
      else { t = 0; setPlaying(true); }
    } else if (e.code === 'KeyR'){
      e.preventDefault();
      doReset();
    }
  });

  function resizeAll(){
    ['animCanvas', 'vtCanvas', 'xtCanvas'].forEach(id => {
      const cv = el(id);
      const dpr = window.devicePixelRatio || 1;
      const w = cv.clientWidth, h = cv.clientHeight;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    });
  }
  window.addEventListener('resize', () => { resizeAll(); render(); });
  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => { resizeAll(); render(); });
    ['animCanvas', 'vtCanvas', 'xtCanvas'].forEach(id => ro.observe(el(id)));
  }

  loadPreset('p1');
  resizeAll();
  apply();
}

if (typeof document !== 'undefined') boot();
</script>
</body>
</html>
